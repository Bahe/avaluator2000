<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaluator2000 · MP8 Aplicacions web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2830; --ink-soft:#4a5a66; --ink-mute:#7d8b95;
  --paper:#eef0ee; --card:#ffffff; --line:#dbe0dd; --line-soft:#e8ebe8;
  --blau:#23559c; --blau-soft:#e8eef8; --blau-line:#b9cbe8;
  --verd:#2f7d4f; --verd-soft:#e5f2e9;
  --roig:#b23a3a; --roig-soft:#f8e8e8;
  --ambre:#96690f; --ambre-soft:#f7efdc;
  --r:10px;
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3,.brand,.tab,.navsec{font-family:'Archivo',sans-serif}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#e8ecef;padding:20px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:0 20px 14px;border-bottom:1px solid #33414c}
.brand .mod{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#93a4b0}
.brand .nom{font-size:19px;font-weight:700;letter-spacing:.01em}
.navsec{padding:12px 22px 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7d8e99;font-weight:600}
nav{padding:2px 10px;display:flex;flex-direction:column;gap:2px}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#c3cdd4;
  padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:600;letter-spacing:.02em;font-family:'Archivo'}
.tab .k{display:inline-block;width:20px;text-align:center;font-size:14px;flex-shrink:0}
.tab:hover{background:#2a3742;color:#fff}
.tab.on{background:var(--blau);color:#fff}
.tab .tabtxt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3;min-width:0}
.tab .tabnom{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.tab .tabsub{font-size:10px;letter-spacing:0;text-transform:none;font-weight:500;color:#8a99a3;font-family:'Inter'}
.tab.on .tabsub{color:#d7e2ee}
.tab.afegeix{color:#7d8e99;font-weight:600}
.tab.afegeix:hover{color:#fff}
.tab.curs{align-items:flex-start}
.side .foot{margin-top:auto;padding:14px 20px;font-size:11.5px;color:#8a99a3;border-top:1px solid #33414c}
#estat-desat{display:inline-flex;align-items:center;gap:6px}
#estat-desat .dot{width:7px;height:7px;border-radius:50%;background:#5cb87a;display:inline-block}
#estat-desat.saving .dot{background:#e2b53e}
#estat-desat.mem .dot{background:#d97066}

.subtabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1.5px solid var(--line)}
.stab{background:none;border:0;padding:9px 14px 10px;font-family:'Archivo';font-weight:600;font-size:13.5px;
  color:var(--ink-mute);border-bottom:2.5px solid transparent;margin-bottom:-1.5px}
.stab:hover{color:var(--ink)}
.stab.on{color:var(--blau);border-color:var(--blau)}

.main{padding:26px 30px 40px;max-width:1220px}
.crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:4px}
.crumb a{color:var(--blau);text-decoration:none;cursor:pointer}
.crumb a:hover{text-decoration:underline}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.lead{color:var(--ink-soft);font-size:14px;margin-bottom:22px;max-width:75ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}
.tile{display:flex;align-items:center;gap:12px;text-align:left;background:#f5f7f8;border:1px solid var(--line);
  border-radius:10px;padding:13px 15px;cursor:pointer;width:100%}
.tile:hover{border-color:var(--blau);background:#eef3fb}
.tile .tile-ic{font-size:19px;width:26px;text-align:center;flex-shrink:0;color:var(--blau)}
.tile .tile-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tile-txt b{font-family:'Archivo';font-size:13.5px;font-weight:700}
.tile .tile-txt span{font-size:11.5px;color:var(--ink-mute)}
tr.fila-click{cursor:pointer}
tr.fila-click:hover{background:#eef3fb}
tr.fila-click td a{position:relative;z-index:1}

/* ---- primitives ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:700;margin-bottom:10px}
.card h3{font-size:14px;font-weight:700;margin:14px 0 8px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .lab{font-size:12px;color:var(--ink-mute)}
.stat .val{font-family:'Archivo';font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--ink-soft)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:'Archivo';font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);
  text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;font-weight:600}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mut{color:var(--ink-mute)} .soft{color:var(--ink-soft)}
.tiny{font-size:12px}

.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--ink-mute)}
.btn.pri{background:var(--blau);border-color:var(--blau);color:#fff}
.btn.pri:hover{background:#1c4784}
.btn.peril{color:var(--roig);border-color:#e4c4c4}
.btn.peril:hover{background:var(--roig-soft)}
.btn.mini{padding:3px 9px;font-size:12px;border-radius:6px}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.spacer{flex:1}

input[type=text],input[type=number],select,textarea{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:13.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blau-line);border-color:var(--blau)}
input.inline{border-color:transparent;background:transparent;width:100%;padding:5px 7px;border-radius:6px}
input.inline:hover{background:#f4f6f4;border-color:var(--line)}
input.inline:focus{background:#fff}
input.nota{width:66px;text-align:right;font-variant-numeric:tabular-nums}
textarea{width:100%;resize:vertical;min-height:44px;font-size:12.5px;line-height:1.4}

.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.b-blau{background:var(--blau-soft);color:var(--blau)}
.b-verd{background:var(--verd-soft);color:var(--verd)}
.b-roig{background:var(--roig-soft);color:var(--roig)}
.b-ambre{background:var(--ambre-soft);color:var(--ambre)}
.b-gris{background:#eef1ef;color:var(--ink-soft)}

.nota-final{font-family:'Archivo';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.nota-final.pend{color:var(--roig)}
.nota-final.prov{color:var(--ink-mute)}

.avis{border-left:3px solid var(--ambre);background:var(--ambre-soft);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;margin:12px 0}
.avis.roig{border-color:var(--roig);background:var(--roig-soft)}
.avis.blau{border-color:var(--blau);background:var(--blau-soft)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink-mute);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:#f1f4f1}
.seg button.on{background:var(--blau);color:#fff}
.equip-card{border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden;background:#fff}
.equip-head{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#f6f8f6;border-bottom:1px solid var(--line)}
.equip-head .n{font-family:'Archivo';font-weight:700;font-size:14.5px}
.equip-head .nota-eq{margin-left:auto;font-family:'Archivo';font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.equip-body{padding:6px 16px 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f4f1;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px;margin:3px 4px 3px 0}
.chip .x{border:0;background:none;color:var(--ink-mute);font-size:13px;padding:0 1px;line-height:1}
.chip .x:hover{color:var(--roig)}
.sumtot{font-family:'Archivo';font-weight:700}
.ok{color:var(--verd)} .ko{color:var(--roig)}
.ratag{display:inline-flex;align-items:center;gap:5px;margin:2px 8px 2px 0;font-size:12.5px}
.side{grid-row:1 / span 2}
.peu{grid-column:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 30px;border-top:1px solid var(--line);color:var(--ink-mute);font-size:12px}
.peu a{color:var(--blau);text-decoration:none}
.peu a:hover{text-decoration:underline}
@media (max-width:840px){.app{grid-template-columns:1fr}.side{position:static;height:auto;grid-row:auto}.main{padding:20px 14px 60px}.peu{grid-column:1;padding:14px}}

/* ---- modal (substitueix confirm/prompt/alert natius, que no funcionen en entorns com un artefacte incrustat) ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(29,40,48,.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.modal-box{background:#fff;border-radius:12px;padding:20px 22px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.modal-box p{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;margin-bottom:14px;line-height:1.5}
.modal-box input[type=text]{width:100%;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.modal-select{width:100%;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;padding:6px;font-size:13.5px;font-family:'Inter'}
.modal-select option{padding:5px 7px}

.badge.b-draft{background:#f7efdc;color:var(--ambre)}
.barra-sel{position:sticky;top:0;z-index:5;background:var(--blau-soft);border:1px solid var(--blau-line);border-radius:8px;
  padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.cel-buida{background:#fdf8ef}
td.sticky-nom,th.sticky-nom{position:sticky;left:0;background:var(--card);z-index:2}
tr:hover td.sticky-nom{background:#f3f6fa}
.prog{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden;min-width:90px;flex:0 0 90px}
.prog i{display:block;height:100%;background:var(--verd)}

th.cap-ra-res{max-width:120px;white-space:normal;text-transform:none;letter-spacing:0;font-size:11px;vertical-align:bottom}

/* Fitxa de l'alumne */
.fitxa-resum{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap;margin:14px 0 18px}
.fitxa-nota{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 20px;min-width:180px}
.fitxa-nota .gran{font-family:'Archivo';font-weight:700;font-size:34px;line-height:1.1;margin:2px 0}
.fitxa-ras{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}
.fitxa-chip{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;min-width:74px;cursor:pointer}
.fitxa-chip:hover{border-color:var(--blau)}
.fitxa-chip b{font-family:'Archivo';font-size:11.5px;color:var(--blau)}
.fitxa-chip span{font-family:'Archivo';font-weight:700;font-size:17px}
.fitxa-chip i{font-style:normal;font-size:10px}
.fitxa-blocs{border-top:1px solid var(--line-soft);padding-top:10px;margin-top:12px}
.fitxa-bloc-cap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
table.fitxa-taula td{padding:5px 8px;border-bottom:1px dashed var(--line-soft);font-size:13px}
table.fitxa-taula tr:last-child td{border-bottom:0}
.nom-clic{color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink-mute);cursor:pointer}
.nom-clic:hover{color:var(--blau);border-color:var(--blau)}

/* Graella completa (estil quadern de notes): columnes fixes a l'esquerra i scroll lateral */
.main.ample{max-width:none}
.graella-wrap{overflow-x:auto;padding:0}
table.graella{width:auto;border-collapse:separate;border-spacing:0}
table.graella th,table.graella td{border-bottom:1px solid var(--line-soft)}
/* capçalera d'activitat: dues línies i punts suspensius si no hi cap */
table.graella{table-layout:fixed}
table.graella th.cap-act{width:104px;min-width:104px;max-width:104px;vertical-align:bottom;
  padding:8px 8px 9px;text-transform:none;letter-spacing:0;white-space:normal}
table.graella th.cap-act span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;font-weight:600;font-size:11.5px;line-height:1.28;color:var(--ink-soft);
  word-break:break-word;max-height:2.6em}
table.graella td.cel-act{width:104px;min-width:104px;padding:4px 6px;text-align:center}
table.graella input.nota-cel{width:60px;padding:4px 2px;text-align:center}
/* columnes fixes: nom de l'alumne i, just després, la nota de l'RA */
table.graella th.sticky-nom,table.graella td.sticky-nom{left:0;min-width:170px;max-width:170px;padding-left:12px}
table.graella th.sticky-ra,table.graella td.sticky-ra{position:sticky;left:170px;z-index:2;width:78px;min-width:78px;
  text-align:center;background:var(--card);border-right:2px solid var(--blau-line)}
table.graella th.sticky-ra{z-index:6;background:var(--blau-soft);color:var(--blau);text-transform:none;letter-spacing:0;font-size:11.5px;padding:8px 6px}
table.graella th.sticky-nom{z-index:6}
tr:hover td.sticky-ra{background:#f3f6fa}
/* bandes de color segons la nota (buit = color per defecte) */
.n-baix{background:#fbeaea!important}
.n-just{background:#fbf3df!important}
.n-ok{background:#e9f4ed!important}
table.graella th.cap-act.mou{cursor:grab}
table.graella th.cap-act.mou:active{cursor:grabbing}
table.graella th.cap-act.mou:hover{background:var(--blau-soft)}
table.graella th.drop-abans{box-shadow:inset 3px 0 0 var(--blau)}
table.graella th.drop-despres{box-shadow:inset -3px 0 0 var(--blau)}
table.graella td.sticky-ra .nota-final{font-size:15px}

.lock-screen{position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px}
.lock-card{background:#fff;border-radius:14px;padding:34px 30px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lock-title{font-family:'Archivo';font-weight:700;font-size:19px;margin:14px 0 4px;color:var(--ink)}
.lock-sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px}
.lock-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:center;box-sizing:border-box}
.lock-error{color:var(--roig);font-size:12.5px;margin-top:10px}
.switch-row{display:flex;align-items:center;gap:8px;font-family:'Archivo';font-weight:600;font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand">
      <div class="mod">Gestor de notes</div>
      <div class="nom">Avaluator2000</div>
    </div>
    <div class="navsec">Grups-aula</div>
    <nav id="nav-grups"></nav>
    <div class="navsec">Grup-aula</div>
    <nav id="nav-grup"></nav>
    <div class="navsec">General</div>
    <nav id="nav-general"></nav>
    <div class="foot">
      <span id="estat-desat"><span class="dot"></span><span id="estat-txt">Carregant…</span></span>
    </div>
  </aside>
  <main class="main" id="main"></main>
  <footer class="peu">
    <span><b>Avaluator2000</b> · gestor de notes per a mòduls professionals</span>
    <span class="spacer"></span>
    <a href="https://github.com/Bahe/avaluator2000" target="_blank" rel="noopener">Codi i documentació a GitHub</a>
  </footer>
</div>
<div id="modal-root"></div>
<div id="lock-screen" class="lock-screen" style="display:none">
  <div class="lock-card">
    <svg viewBox="0 0 96 96" width="56" height="56" style="display:block;margin:0 auto">
      <rect x="0" y="0" width="96" height="96" rx="22" fill="#23559c"/>
      <rect x="16" y="16" width="30" height="30" rx="6" fill="#e8eef8" opacity=".35"/>
      <rect x="50" y="16" width="30" height="30" rx="6" fill="#e8eef8" opacity=".35"/>
      <rect x="16" y="50" width="30" height="30" rx="6" fill="#e8eef8" opacity=".35"/>
      <rect x="50" y="50" width="30" height="30" rx="6" fill="#2f7d4f"/>
      <path d="M 58 65 L 64 71 L 76 58" stroke="white" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="lock-title">Avaluator2000</div>
    <p class="lock-sub">Portal protegit amb contrasenya.</p>
    <input id="lock-pw" class="lock-input" type="password" placeholder="Contrasenya" autocomplete="current-password" onkeydown="if(event.key==='Enter')intentaDesbloqueig()">
    <button class="btn pri" style="width:100%;margin-top:10px" onclick="intentaDesbloqueig()">Desbloqueja</button>
    <p id="lock-error" class="lock-error" style="display:none">Contrasenya incorrecta.</p>
  </div>
</div>

<script>
"use strict";
/* ================= utilitats ================= */
const $ = (s, r=document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=1) => (n === null || n === undefined || isNaN(n)) ? "—" : n.toFixed(d).replace(".", ",");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const deep = o => JSON.parse(JSON.stringify(o));

/* ---- modal propi: substitueix confirm()/prompt()/alert() natius, que poden no funcionar
   (per exemple dins d'un iframe amb sandbox, com el previsualitzador d'artefactes) ---- */
function dialogModal(cos, { tipus = "confirm", valorInicial = "" } = {}) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${esc(cos)}</p>
        ${tipus === "prompt" ? `<input type="text" id="modal-input" value="${esc(valorInicial)}">` : ""}
        <div class="modal-actions">
          ${tipus !== "alert" ? `<button class="btn" id="modal-cancelar">Cancel·la</button>` : ""}
          <button class="btn pri" id="modal-ok">D'acord</button>
        </div>
      </div>`;
    document.getElementById("modal-root").appendChild(overlay);
    const input = overlay.querySelector("#modal-input");
    if (input) { input.focus(); input.select(); }
    const acaba = valor => { overlay.remove(); resolve(valor); };
    overlay.querySelector("#modal-ok").onclick = () => acaba(tipus === "prompt" ? (input.value ?? "") : true);
    const btnCancel = overlay.querySelector("#modal-cancelar");
    if (btnCancel) btnCancel.onclick = () => acaba(tipus === "prompt" ? null : false);
    overlay.addEventListener("keydown", e => {
      if (e.key === "Escape") acaba(tipus === "prompt" ? null : false);
      if (e.key === "Enter" && tipus !== "alert") acaba(tipus === "prompt" ? (input.value ?? "") : true);
    });
    overlay.addEventListener("mousedown", e => { if (e.target === overlay) acaba(tipus === "prompt" ? null : false); });
  });
}

/* Selector amb desplegable de veritat (substitueix els prompts on calia escriure un número).
   opcions: [{valor, etiqueta, sub}] · retorna el valor triat, o null si es cancel·la. */
function selectModal(cos, opcions, { valorInicial = null, etiquetaOk = "D'acord" } = {}) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-box">
        <p>${esc(cos)}</p>
        <select id="modal-select" class="modal-select" size="${Math.min(Math.max(opcions.length, 3), 8)}">
          ${opcions.map(o => `<option value="${esc(String(o.valor))}" ${String(o.valor) === String(valorInicial) ? "selected" : ""}>${esc(o.etiqueta)}${o.sub ? " — " + esc(o.sub) : ""}</option>`).join("")}
        </select>
        <div class="modal-actions">
          <button class="btn" id="modal-cancelar">Cancel·la</button>
          <button class="btn pri" id="modal-ok">${esc(etiquetaOk)}</button>
        </div>
      </div>`;
    document.getElementById("modal-root").appendChild(overlay);
    const sel = overlay.querySelector("#modal-select");
    if (!sel.value && opcions.length) sel.selectedIndex = 0;
    sel.focus();
    const acaba = v => { overlay.remove(); resolve(v); };
    overlay.querySelector("#modal-ok").onclick = () => acaba(sel.value);
    overlay.querySelector("#modal-cancelar").onclick = () => acaba(null);
    sel.ondblclick = () => acaba(sel.value);
    overlay.addEventListener("keydown", e => {
      if (e.key === "Escape") acaba(null);
      if (e.key === "Enter") acaba(sel.value);
    });
    overlay.addEventListener("mousedown", e => { if (e.target === overlay) acaba(null); });
  });
}

/* ---- migració des de la v1 (un sol repte) ---- */
function migraV1(v1) {
  const nou = deep(seed().cursos[0]);
  nou.id = uid();
  nou.alumnes = v1.alumnes.map(a => ({ id: a.id, nom: a.nom }));
  const equips = v1.equips.map(e => ({ id: e.id, nom: e.nom, membres: v1.alumnes.filter(a => a.equipId === e.id).map(a => a.id) }));
  const r1 = nou.reptes[0];
  r1.equips = equips;
  r1.instruments = v1.instruments;
  r1.rubriques = v1.rubriques;
  r1.avaluacions = v1.avaluacions;
  // els reptes 2 i 3 de mostra queden amb els equips reals migrats
  nou.reptes[1].equips = deep(equips).map(e => ({ ...e, id: uid() }));
  nou.reptes[2].equips = deep(equips).map(e => ({ ...e, id: uid() }));
  return nou; // curs pla; normalitza() l'embolicarà en el contenidor multicurs
}

/* --- IndexedDB: recorda el FileHandle entre sessions --- */
function idb() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open("gestor_mp8", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbSet(k, v) { try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function idbGet(k) { try { const db = await idb(); return await new Promise(res => { const t = db.transaction("kv", "readonly"); const rq = t.objectStore("kv").get(k); rq.onsuccess = () => res(rq.result ?? null); rq.onerror = () => res(null); }); } catch (e) { return null; } }
async function idbDel(k) { try { const db = await idb(); await new Promise(res => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }

async function llegeixClaude(clau) {
  try { const r = await window.storage.get(clau); return r && r.value ? JSON.parse(r.value) : null; }
  catch (e) { return null; }
}

  if (!dadesOriginal) return null;
  let dades = dadesOriginal;
  if (dades.versio !== 2 && dades.versio !== 3 && dades.alumnes && dades.instruments) {
    const curs = migraV1(dades);
    dades = { versio: 3, cursos: [curs], cursActual: curs.id };
  } else if (dades.versio === 2 || (!dades.versio && dades.config && dades.reptes)) {
    // v2: un sol curs pla al nivell arrel → l'emboliquem en el contenidor multicurs
    const curs = {
      id: uid(), modul: "Mòdul", grup: "Grup 1",
      config: dades.config, alumnes: dades.alumnes, reptes: dades.reptes,
      notesDirectes: dades.notesDirectes || {}, categoriesGenerals: dades.categoriesGenerals, activitatsRA: dades.activitatsRA || {},
      actual: dades.actual,
    };
    dades = { versio: 3, cursos: [curs], cursActual: curs.id };
  }
  // backfill de camps que poden faltar en desats de versions anteriors d'aquest fil
  dades.cursos.forEach(c => {
    if (!c.categoriesGenerals) c.categoriesGenerals = deep(seed().cursos[0].categoriesGenerals);
    if (!c.activitatsRA) c.activitatsRA = {};
    if (!c.modul) c.modul = "Mòdul";
    if (!c.grup) c.grup = "Grup 1";
    (c.config?.ras || []).forEach(ra => { if (!ra.mode) ra.mode = ra.directe ? "directe" : "reptes"; });
  });
  if (!dades.cursos.some(c => c.id === dades.cursActual)) dades.cursActual = dades.cursos[0]?.id;
  if (!dades.seguretat) dades.seguretat = { activat: false, hash: null, minutsInactivitat: null };
  return dades;
}
async function initStorage() {
  // 0) aplicació web de Google Apps Script → Google Drive
  if (enGAS) {
    try {
      const txt = await gasCrida("llegeixDades");
      backend = "gas";
      return normalitza(txt ? JSON.parse(txt) : null);
    } catch (e) { /* seguim amb les altres capes */ }
  }
  // 1) dins de Claude
  if (window.storage) {
    try {
      await window.storage.set(KEY + "_ping", "1");
      backend = "claude";
      return normalitza(await llegeixClaude(KEY) || await llegeixClaude(KEY_V1));
    } catch (e) { /* seguim amb el mode local */ }
  }
  // 2) mode local: localStorage + fitxer recordat
  backend = "local";
  let dades = null;
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) dades = JSON.parse(raw);
  } catch (e) { backend = "mem"; }
  if (suportaFSA) {
    const h = await idbGet("fitxer");
    if (h) {
      fitxerHandle = h; fitxerNom = h.name; calReconnectar = true;
      try {
        if (h.queryPermission && (await h.queryPermission({ mode: "readwrite" })) === "granted") {
          calReconnectar = false;
          const f = await h.getFile();
          const txt = await f.text();
          if (txt.trim()) dades = JSON.parse(txt);
        }
      } catch (e) { /* pendent de reconnexió manual */ }
    }
  }
  return normalitza(dades);
}
function save() {
  clearTimeout(saveTimer);
  setEstat("saving", "Desant…");
  saveTimer = setTimeout(async () => {
    const on = [];
    if (backend === "gas") {
      try { await gasCrida("desaDades", JSON.stringify(state, null, 2)); on.push("a Google Drive"); } catch (e) {}
    } else if (backend === "claude") {
      try { await window.storage.set(KEY, JSON.stringify(state)); on.push("a Claude"); } catch (e) {}
    } else {
      try { localStorage.setItem(KEY, JSON.stringify(state)); if (backend === "local") on.push("al navegador"); } catch (e) {}
      if (fitxerHandle && !calReconnectar) {
        try {
          const w = await fitxerHandle.createWritable();
          await w.write(JSON.stringify(state, null, 2));
          await w.close();
          on.push("a «" + fitxerNom + "»");
        } catch (e) { calReconnectar = true; }
      }
    }
    if (on.length) setEstat("", "Desat " + on.join(" i "));
    else setEstat("mem", "Mode memòria: exporta per no perdre res");
  }, 500);
}

async function connectaFitxer() {
  if (!suportaFSA) {
    await alertModal("Aquest navegador no permet connectar fitxers (cal Chrome, Edge o un altre navegador basat en Chromium). Mentrestant, les dades es desen al navegador i pots exportar el JSON manualment.");

    });

}
async function reconnectaFitxer() {
  if (!fitxerHandle) return;
  try {
    if ((await fitxerHandle.requestPermission({ mode: "readwrite" })) !== "granted") return;
    calReconnectar = false;
    try {
      const f = await fitxerHandle.getFile();
      const txt = await f.text();
      if (txt.trim()) {
        const dades = normalitza(JSON.parse(txt));
        if (dades && JSON.stringify(dades) !== JSON.stringify(state)
            && await confirmModal("El fitxer «" + fitxerNom + "» conté dades. Vols carregar-les? (Cancel·la per mantenir les dades d'ara i sobreescriure el fitxer)")) {
          state = dades;
          if (!C().reptes.some(r => r.id === C().actual)) C().actual = C().reptes[0].id;
        }
      }
    } catch (e) {}
    save(); render();
  } catch (e) {}
}
async function desconnectaFitxer() {

/* ================= accés a l'estat ================= */
const R = () => C().reptes.find(r => r.id === C().actual) || C().reptes[0];
const alumne = id => C().alumnes.find(a => a.id === id);
const raConf = id => C().config.ras.find(r => r.id === id);
/* Els RA només tenen nom de cara a l'usuari: l'id és una clave interna que no es mostra mai. */
const raNom = id => (raConf(id) || {}).nom || "RA";
const escurca = (t, n) => (t || "").length > n ? (t || "").slice(0, n - 1) + "…" : (t || "");
const equipDe = (rep, id) => rep.equips.find(e => e.id === id);
const instrDe = (rep, id) => rep.instruments.find(i => i.id === id);
const equipAlumne = (rep, alId) => rep.equips.find(e => e.membres.includes(alId));
const raMode = ra => ra?.mode || (ra?.directe ? "directe" : "reptes"); // "reptes" | "activitats" | "directe"

/* ================= càlculs ================= */
function notaEquip(rep, instrId, equipId) {
  const reg = rep.avaluacions.equip[instrId]?.[equipId];
  const rub = rep.rubriques[instrId];
  if (!reg || !rub || !rub.files.length || !reg.nivells) return null;
  let suma = 0;
  for (let i = 0; i < rub.files.length; i++) {
    const v = reg.nivells[i];
    if (v === null || v === undefined) return null;
    suma += v;
  }
  return (suma / (3 * rub.files.length)) * 10;
}
const factorDe = (rep, instrId, alId) => rep.avaluacions.factors[instrId]?.[alId] ?? 1.0;
function notaIndividual(rep, instrId, alId) {
  const ins = instrDe(rep, instrId);
  if (!ins) return null;
  if (ins.tipus === "individual") {
    const v = rep.avaluacions.individual[instrId]?.[alId];
    return (v === null || v === undefined || v === "") ? null : Number(v);
  }
  const eq = equipAlumne(rep, alId);
  if (!eq) return null;
  const ne = notaEquip(rep, instrId, eq.id);
  if (ne === null) return null;
  return Math.min(10, ne * factorDe(rep, instrId, alId));
}
function notaRARepte(rep, alId, ra) {
  let pesTot = 0, pesAval = 0, sumaAval = 0, pendent = false, minimPendentAval = false;
  for (const ins of rep.instruments) {
    const p = Number(ins.pes[ra]) || 0;
    if (p <= 0) continue;
    pesTot += p;
    const n = notaIndividual(rep, ins.id, alId);
    if (n !== null) {
      pesAval += p; sumaAval += p * n;
      if (ins.minim != null && n < ins.minim) pendent = true;
    } else if (ins.minim != null) minimPendentAval = true;
  }
  if (pesAval === 0) return { nota: null, completa: false, pendent: false };
  return { nota: sumaAval / pesAval, completa: pesAval >= pesTot && !minimPendentAval, pendent };
}
/* ---- càlculs per a RA en mode "activitats" (categories ponderades) ---- */
function valorActivitat(act, alId) {
  const v = act.notes[alId];
  if (v === undefined || v === null || v === "") return null;
  return act.tipus === "fetnofet" ? (v ? 10 : 0) : Number(v);
}
function notaCategoria(cat, activitats, alId) {
  const rellevants = activitats.filter(a => a.categoriaId === cat.id);
  if (!rellevants.length) return { nota: null, completa: false };
  const valors = rellevants.map(a => valorActivitat(a, alId)).filter(v => v !== null);
  if (!valors.length) return { nota: null, completa: false };
  return { nota: valors.reduce((s, v) => s + v, 0) / valors.length, completa: valors.length === rellevants.length };
}
function notaRAActivitats(raId, alId) {
  const dades = C().activitatsRA[raId];
  if (!dades || !dades.categories.length) return { nota: null, completa: false, pendent: false };
  let pesTot = 0, pesAval = 0, suma = 0, pendent = false, completa = true;
  for (const cat of dades.categories) {
    const p = Number(cat.pes) || 0;
    if (p <= 0) continue;
    pesTot += p;
    const { nota, completa: catCompleta } = notaCategoria(cat, dades.activitats, alId);
    if (nota === null) { completa = false; continue; }
    pesAval += p; suma += p * nota;
    if (!catCompleta) completa = false;
    if (cat.minim != null && nota < cat.minim) pendent = true;
  }
  if (pesAval === 0) return { nota: null, completa: false, pendent: false };
  return { nota: suma / pesAval, completa: completa && pesAval >= pesTot, pendent };
}
function notaRAModul(alId, raId) {
  const ra = raConf(raId);
  const mode = raMode(ra);
  if (mode === "directe") {
    const v = C().notesDirectes[raId]?.[alId];
    return { nota: (v === null || v === undefined || v === "") ? null : Number(v), completa: v !== undefined && v !== null && v !== "", pendent: false, reptes: [] };
  }
  if (mode === "activitats") {
    return { ...notaRAActivitats(raId, alId), reptes: [] };
  }
  const reps = C().reptes.filter(r => r.ras.includes(raId));
  if (!reps.length) return { nota: null, completa: false, pendent: false, reptes: [] };
  const parts = reps.map(r => notaRARepte(r, alId, raId));
  const ambNota = parts.filter(p => p.nota !== null);
  if (!ambNota.length) return { nota: null, completa: false, pendent: false, reptes: reps };
  return {
    nota: ambNota.reduce((s, p) => s + p.nota, 0) / ambNota.length,
    completa: ambNota.length === parts.length && parts.every(p => p.completa),
    pendent: parts.some(p => p.pendent),
    reptes: reps,
  };
}
function notaModul(alId) {
  let pesAval = 0, suma = 0, pesTot = 0, pendent = false, completa = true;
  for (const ra of C().config.ras) {
    const p = Number(ra.pes) || 0;
    if (p <= 0) continue;
    pesTot += p;
    const x = notaRAModul(alId, ra.id);
    if (x.pendent) pendent = true;
    if (x.nota !== null) { pesAval += p; suma += p * x.nota; if (!x.completa) completa = false; }
    else completa = false;
  }
  if (pesAval === 0) return { nota: null, completa: false, pendent: false };
  return { nota: suma / pesAval, completa: completa && pesAval >= pesTot, pendent };
}

function detallRAAlumne(ra, alId) {
  const c = C(), mode = raMode(ra), x = notaRAModul(alId, ra.id);

    else cos = d.categories.map(cat => {
      const nc = notaCategoria(cat, d.activitats, alId);

      const sotaMinim = cat.minim != null && nc.nota !== null && nc.nota < cat.minim;

        <table class="fitxa-taula">
          ${acts.map(a => {
            const v = valorActivitat(a, alId);
            const brut = a.notes[alId];
            return `<tr>
              <td>${esc(a.nom)}${a.esborrany ? ' <span class="badge b-draft">esborrany</span>' : ""}${a.rubrica ? ' <span class="badge b-verd">rúbrica</span>' : ""}</td>

    else cos = reps.map(rep => {

        ${!instr.length ? '<p class="tiny mut" style="padding:6px 0">Cap instrument amb pes en aquest RA.</p>' : `
        <table class="fitxa-taula">

            </tr>`;
          }).join("")}
        </table>`}
      </div>`;
    }).join("");

  return `<div class="card" id="ra-${esc(ra.id)}">${cap}${cos}</div>`;

  const eqIns = rep.instruments.filter(i => i.tipus === "equip");
  if (!rep.instruments.some(i => i.id === selInstrument)) selInstrument = rep.instruments[0]?.id ?? null;
  if (!eqIns.some(i => i.id === selRubrica)) selRubrica = eqIns[0]?.id ?? null;
  const cosos = { tauler: vTauler, equips: vEquips, ponderacio: vInstruments, rubriques: vRubriques, configuracio: vConfigRepte };
  return `

  ${cosos[subRepte](rep)}`;
}
/* ---- pàgina d'un RA en mode "activitats": només muntatge (categories i activitats) ---- */
let raActiuUI = null;
function paginaRAActivitats(raId) {
  const ra = raConf(raId);
  if (raActiuUI !== raId) { // en canviar d'RA, no arrosseguem seleccions ni filtres de l'anterior
    raActiuUI = raId; selActivitats.clear();
    filtreCatAct = ""; cercaAct = ""; filtreEsborrany = ""; filtreCatAvalua = ""; actAvaluant = null;
  }
  if (!SUB_RA.some(s => s.id === subRA)) subRA = "categories";

    <span class="spacer"></span><button class="btn mini" onclick="avaluaRA('${raId}')">Avalua aquest RA →</button></div>

/* ================= render ================= */
function render() {
  nav();
  const Rv = { avaluar: vAvaluarHub, resultats: vResultats, contingut: vContingut,
               alumnat: vAlumnatPag, config: vConfigGrup, dades: vDades, seguretat: vSeguretat };
  let contingut;
  if (vista && vista.startsWith("repte:")) {
    const id = vista.slice(6);
    const rep = C().reptes.find(r => r.id === id);
    if (!rep) { vista = "contingut"; return render(); }
    C().actual = id;
    contingut = paginaRepte(rep);
  } else if (vista && vista.startsWith("alumne:")) {
    contingut = vFitxaAlumne(vista.slice(7));
  } else if (vista && vista.startsWith("ra:")) {
    const raId = vista.slice(3);
    const ra = raConf(raId);
    if (!ra || raMode(ra) === "reptes") { vista = "contingut"; return render(); }
    if (raMode(ra) === "directe") { avaluaRASel = raId; vista = "avaluar"; return render(); }
    contingut = paginaRAActivitats(raId);
  } else {
    contingut = (Rv[vista] || vAvaluarHub)();
  }
  const banner = (backend === "local" && calReconnectar && fitxerHandle)
    ? `<div class="avis" style="margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
         L'autoguardat al fitxer «${esc(fitxerNom)}» està en pausa: el navegador demana permís a cada sessió.
         <button class="btn mini pri" onclick="reconnectaFitxer()">Reconnecta el fitxer</button></div>`
    : "";
  // a la graella completa la pàgina deixa el límit d'amplada per encabir-hi més activitats
  const ample = vista === "avaluar" && modeAvalua === "graella";
  $("#main").className = "main" + (ample ? " ample" : "");
  $("#main").innerHTML = banner + contingut;
  actualitzaHash();
}

/* ---- enllaços amb marcador (slugs a location.hash) ----
   #/dades | #/seguretat
   #/g/<cursId>/avaluar[/ra/<raId>] | /resultats | /contingut | /alumnat | /config
   #/g/<cursId>/repte/<repteId>/<subRepte> | #/g/<cursId>/ra/<raId>/<subRA>
   S'escriu amb replaceState (no genera entrades a l'historial ni dispara "hashchange"). */
const VISTES_SIMPLES = ["avaluar", "resultats", "contingut", "alumnat", "config"];
function actualitzaHash() {
  let h;
  if (vista === "seguretat") h = "#/seguretat";
  else if (vista === "dades") h = "#/dades";
  else if (!state.cursActual) h = "#/dades";
  else {
    h = `#/g/${state.cursActual}`;
    if (vista === "avaluar") h += avaluaRASel ? `/avaluar/ra/${avaluaRASel}` : "/avaluar";
    else if (vista && vista.startsWith("repte:")) h += `/repte/${vista.slice(6)}/${subRepte}`;
    else if (vista && vista.startsWith("ra:")) h += `/ra/${vista.slice(3)}/${subRA}`;
    else if (vista && vista.startsWith("alumne:")) h += `/alumne/${vista.slice(7)}`;
    else if (VISTES_SIMPLES.includes(vista)) h += `/${vista}`;
    else h += "/avaluar";
  }
  if (location.hash !== h) {
    try { history.replaceState(null, "", h); } catch (e) { /* origen opac (iframe amb sandbox): els marcadors no hi funcionen, la resta sí */ }
  }
}
function aplicaHash() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "dades") { vista = "dades"; return true; }
  if (parts[0] === "seguretat") { vista = "seguretat"; return true; }
  if (parts[0] !== "g" || !parts[1]) return false;
  const curs = state.cursos.find(c => c.id === parts[1]);
  if (!curs) return false;
  state.cursActual = curs.id;
  if (!parts[2]) { vista = "avaluar"; return true; }
  if (parts[2] === "repte" && parts[3] && curs.reptes.some(r => r.id === parts[3])) {
    vista = "repte:" + parts[3];
    subRepte = parts[4] && SUB_REPTE.some(s => s.id === parts[4]) ? parts[4] : "tauler";
    return true;
  }
  if (parts[2] === "ra" && parts[3] && curs.config.ras.some(r => r.id === parts[3])) {
    vista = "ra:" + parts[3];
    subRA = parts[4] && SUB_RA.some(s => s.id === parts[4]) ? parts[4] : "categories";
    return true;
  }
  if (parts[2] === "alumne" && parts[3] && curs.alumnes.some(a => a.id === parts[3])) {
    vista = "alumne:" + parts[3]; return true;
  }
  if (parts[2] === "avaluar") {
    vista = "avaluar";
    if (parts[3] === "ra" && parts[4] && curs.config.ras.some(r => r.id === parts[4])) avaluaRASel = parts[4];
    return true;
  }
  if (VISTES_SIMPLES.includes(parts[2])) { vista = parts[2]; return true; }
  vista = "avaluar";
  return true;
}

/* ---- Tauler (del repte actual) ---- */
function vTauler() {
  const rep = R();
  if (!rep) return `<h1>Sense reptes</h1><div class="avis roig">Crea un repte des del botó «+ Nou repte» de la barra lateral.</div>`;
  const eqInstr = rep.instruments.filter(i => i.tipus === "equip");
  const indInstr = rep.instruments.filter(i => i.tipus === "individual");
  const rows = C().alumnes.map(al => {
    const ras = {};
    rep.ras.forEach(ra => ras[ra] = notaRARepte(rep, al.id, ra));
    return { al, ras };
  });
  const mitj = ra => {
    const v = rows.map(r => r.ras[ra].nota).filter(n => n !== null);
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  };
  const pendents = rows.filter(r => rep.ras.some(ra => r.ras[ra].pendent)).length;
  const total = C().alumnes.length * rep.instruments.length;
  let fetes = 0;
  C().alumnes.forEach(al => rep.instruments.forEach(ins => { if (notaIndividual(rep, ins.id, al.id) !== null) fetes++; }));

  const cel = x => {
    if (x.nota === null) return `<td class="num mut">—</td>`;
    const cls = x.pendent ? "pend" : (!x.completa ? "prov" : "");
    const marca = x.pendent ? " ⚑" : (!x.completa ? " *" : "");
    return `<td class="num"><span class="nota-final ${cls}">${fmt(x.nota)}${marca}</span></td>`;
  };

  return `
  <p class="lead">Notes amb <b>*</b>: provisionals (falten instruments). Bandera <span class="nota-final pend">⚑</span>: RA pendent per mínim de PV no assolit.</p>
  <div class="grid-cards">
    ${rep.ras.map(ra => `<div class="stat"><div class="lab">Mitjana ${ra} (prov.)</div><div class="val">${fmt(mitj(ra))}</div><div class="sub">${esc(raConf(ra)?.nom ?? "")}</div></div>`).join("")}
    <div class="stat"><div class="lab">RA pendents</div><div class="val">${pendents}</div><div class="sub">alumnes amb mínim no assolit</div></div>
    <div class="stat"><div class="lab">Progrés</div><div class="val">${total ? Math.round(100 * fetes / total) : 0}%</div><div class="sub">${fetes} de ${total} notes</div></div>
  </div>
  <div class="card" style="overflow-x:auto">
    <div class="toolrow"><h2 style="margin:0">Notes per alumne</h2><span class="spacer"></span>
      <button class="btn" onclick="exportaCSVRepte()">Exporta CSV del repte</button></div>
    <table>
      <tr><th>Alumne/a</th><th>Equip</th>
        ${eqInstr.map(i => `<th class="num" title="${esc(i.nom)}">${esc(i.id)}</th>`).join("")}
        ${indInstr.map(i => `<th class="num" title="${esc(i.nom)}">${esc(i.id)}</th>`).join("")}
        ${rep.ras.map(ra => `<th class="num">${ra}</th>`).join("")}</tr>
      ${rows.map(r => `<tr>
        <td>${esc(r.al.nom)}</td>
        <td class="tiny mut">${esc(equipAlumne(rep, r.al.id)?.nom ?? "Sense equip")}</td>
        ${eqInstr.map(i => { const n = notaIndividual(rep, i.id, r.al.id); const f = factorDe(rep, i.id, r.al.id);
          return `<td class="num ${n === null ? "mut" : ""}" title="factor ×${f.toFixed(1)}">${fmt(n)}</td>`; }).join("")}
        ${indInstr.map(i => { const n = notaIndividual(rep, i.id, r.al.id);
          const baix = n !== null && i.minim != null && n < i.minim;
          return `<td class="num ${n === null ? "mut" : ""}">${baix ? `<span class="badge b-roig">${fmt(n)}</span>` : fmt(n)}</td>`; }).join("")}
        ${rep.ras.map(ra => cel(r.ras[ra])).join("")}
      </tr>`).join("")}
    </table>
  </div>`;
}

function exportaCSVRepte() {
  const rep = R(), sep = ";";
  const eqI = rep.instruments.filter(i => i.tipus === "equip").map(i => i.id);
  const inI = rep.instruments.filter(i => i.tipus === "individual").map(i => i.id);
  let out = ["Alumne", "Equip", ...eqI, ...inI, ...rep.ras, "Estat"].join(sep) + "\n";
  for (const al of C().alumnes) {
    const ras = rep.ras.map(ra => notaRARepte(rep, al.id, ra));
    const n = id => { const v = notaIndividual(rep, id, al.id); return v === null ? "" : v.toFixed(2).replace(".", ","); };
    const estat = ras.some(x => x.pendent) ? "PENDENT (mínim PV)" : (ras.every(x => x.completa) ? "Completa" : "Provisional");
    out += [al.nom, equipAlumne(rep, al.id)?.nom ?? "", ...eqI.map(n), ...inI.map(n),
      ...ras.map(x => x.nota === null ? "" : x.nota.toFixed(2).replace(".", ",")), estat].join(sep) + "\n";
  }
  baixa("notes_" + rep.id + ".csv", out, "text/csv");
}
function baixa(nomFitxer, contingut, tipus) {
  const blob = new Blob(["\ufeff" + contingut], { type: tipus + ";charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nomFitxer; a.click();
  URL.revokeObjectURL(a.href);
}

function blocIndividual(rep, ins) {
  const notes = rep.avaluacions.individual[ins.id] || {};

function posaNotaInd(insId, alId, val) {
  mut(() => {
    const rep = R();
    if (!rep.avaluacions.individual[insId]) rep.avaluacions.individual[insId] = {};
    if (val === "") delete rep.avaluacions.individual[insId][alId];
    else rep.avaluacions.individual[insId][alId] = clamp(Number(val), 0, 10);
  });
}
function blocEquip(rep, ins) {
  const rub = rep.rubriques[ins.id];
  if (!rub || !rub.files.length) {
    return `<div class="avis roig">Aquest entregable no té rúbrica. Ves a <b>Rúbriques</b> i crea-hi les files abans d'avaluar.</div>`;
  }
  const cards = rep.equips.map(eq => {
    const reg = rep.avaluacions.equip[ins.id]?.[eq.id] || { nivells: [] };
    const ne = notaEquip(rep, ins.id, eq.id);
    return `<div class="equip-card">
      <div class="equip-head"><span class="n">${esc(eq.nom)}</span>
        <span class="tiny mut">${eq.membres.length} membres</span>
        <span class="nota-eq ${ne === null ? "mut" : ""}">${ne === null ? "sense nota" : fmt(ne, 2)}</span></div>
      <div class="equip-body">
        <table>
          <tr><th style="width:60px">CA</th><th>Criteri</th><th style="width:340px">Nivell assolit</th></tr>
          ${rub.files.map((f, fi) => {
            const v = reg.nivells[fi];
            return `<tr><td><span class="badge b-blau">${esc(f.ca)}</span></td>
              <td>${esc(f.titol)}<div class="tiny mut">${v !== null && v !== undefined ? esc(f.nivells[v]) : "sense valorar"}</div></td>
              <td><span class="seg">${[0, 1, 2, 3].map(l =>
                `<button class="${v === l ? "on" : ""}" title="${esc(f.nivells[l])}"
                  onclick="posaNivell('${esc(ins.id)}','${eq.id}',${fi},${l})">${l} · ${esc(rub.nivellNoms[l])}</button>`).join("")}</span></td></tr>`;
          }).join("")}
        </table>
        <h3>Factors individuals d'aquest entregable</h3>
        <div>
          ${eq.membres.map(alId => {
            const al = alumne(alId); if (!al) return "";
            const f = factorDe(rep, ins.id, alId);
            const ni = notaIndividual(rep, ins.id, alId);
            return `<span class="chip">${esc(al.nom)}
              <select onchange="posaFactor('${esc(ins.id)}','${alId}',this.value)" style="padding:2px 5px;font-size:12px">
                ${C().config.factorsPermesos.map(x => `<option value="${x}" ${Math.abs(x - f) < 0.001 ? "selected" : ""}>× ${x.toFixed(1).replace(".", ",")}</option>`).join("")}
              </select>
              <b style="font-variant-numeric:tabular-nums">${ni === null ? "—" : fmt(ni, 2)}</b></span>`;
          }).join("") || '<span class="tiny mut">Aquest equip no té membres.</span>'}
        </div>
      </div>
    </div>`;
  }).join("");
  return `<div class="avis blau">Nota de l'entregable = punts obtinguts / punts màxims × 10. El factor (0,8–1,1) multiplica la nota d'equip per a cada membre, amb topall a 10.</div>${cards}`;
}
function posaNivell(insId, eqId, fi, nivell) {
  mut(() => {
    const rep = R();
    const rub = rep.rubriques[insId];
    if (!rep.avaluacions.equip[insId]) rep.avaluacions.equip[insId] = {};
    if (!rep.avaluacions.equip[insId][eqId]) rep.avaluacions.equip[insId][eqId] = { nivells: new Array(rub.files.length).fill(null) };
    const reg = rep.avaluacions.equip[insId][eqId];
    while (reg.nivells.length < rub.files.length) reg.nivells.push(null);
    reg.nivells[fi] = (reg.nivells[fi] === nivell) ? null : nivell;
  });
}
function posaFactor(insId, alId, val) {
  mut(() => {
    const rep = R();
    if (!rep.avaluacions.factors[insId]) rep.avaluacions.factors[insId] = {};
    rep.avaluacions.factors[insId][alId] = Number(val);
  });
}

        onchange="mut(()=>{R().nom=this.value.trim()||'Repte'})">

    <div class="toolrow">

        onchange="mut(()=>{R().trimestre=this.value})">
      <input class="inline" style="flex:1;min-width:220px" type="text" value="${esc(rep.sub || "")}" placeholder="Descripció breu"

      onchange="toggleRA('${rep.id}','${ra.id}',this.checked)"> ${ra.id} <span class="mut">· ${esc(ra.nom)}</span></label>`).join("") || '<span class="tiny mut">Cap RA en mode «Reptes» al mòdul.</span>'}</div>
  </div>
  <div class="card" style="max-width:640px">
    <h2>Estat</h2>
    <p class="tiny mut">${rep.equips.length} equips · ${rep.instruments.length} instruments · ${Object.keys(rep.rubriques).length} rúbriques · progrés d'avaluació ${total ? Math.round(100 * fetes / total) : 0}%</p>
  </div>
  <div class="card" style="max-width:640px">
    <h2>Accions</h2>
    <div class="toolrow">
      <button class="btn" onclick="duplicaRepte('${rep.id}')">Duplica aquest repte</button>
      <button class="btn peril" onclick="esborraRepte('${rep.id}')">Esborra aquest repte</button>
    </div>
  </div>`;
}
async function toggleRA(repId, raId, on) {
  const rep = C().reptes.find(r => r.id === repId);
  if (!on) {
    const altres = C().reptes.filter(r => r.id !== repId && r.ras.includes(raId));
    const teNotes = rep.instruments.some(i => (Number(i.pes[raId]) || 0) > 0);
    if (teNotes && !await confirmModal(`Hi ha instruments amb pes a «${raNom(raId)}». Si el desmarques, aquest repte deixarà de comptar-hi${altres.length ? "" : " i cap repte no el treballarà"}. Continuar?`)) { render(); return; }
  }
  mut(() => {
    if (on) { if (!rep.ras.includes(raId)) rep.ras.push(raId); rep.ras.sort(); rep.instruments.forEach(i => { if (i.pes[raId] === undefined) i.pes[raId] = 0; }); }
    else rep.ras = rep.ras.filter(x => x !== raId);
  });
}
function nouRepte() {
  const id = uid();
  mut(() => {
    C().reptes.push({
      id, nom: "Repte nou", sub: "", trimestre: "", ras: [],
      equips: [],
      instruments: [
        { id: "PV", nom: "PV · Validació individual", tipus: "individual", pes: {}, minim: 4 },
        { id: "OBS", nom: "Observació · diari, rols i actitud", tipus: "individual", pes: {}, minim: null },
      ],
      rubriques: {},
      avaluacions: { equip: {}, factors: {}, individual: {} },
    });
    C().actual = id;
    vista = "repte:" + id;
    subRepte = "configuracio";
  });
}
async function duplicaRepte(id) {
  const orig = C().reptes.find(r => r.id === id);
  const copiaEquips = await confirmModal("Vols copiar també els equips i els seus membres? (D'acord = sí; Cancel·la = equips buits)");
  mut(() => {
    const nou = deep(orig);
    nou.id = uid();
    nou.nom = orig.nom + " (còpia)";
    nou.avaluacions = { equip: {}, factors: {}, individual: {} };
    nou.equips = copiaEquips ? deep(orig.equips).map(e => ({ ...e, id: uid() })) : [];
    C().reptes.push(nou);
    C().actual = nou.id;
    vista = "repte:" + nou.id;
    subRepte = "configuracio";
  });
}
async function esborraRepte(id) {
  const rep = C().reptes.find(r => r.id === id);
  if (!await confirmModal(`Esborrar «${rep.nom}» amb tots els seus equips, rúbriques i notes? Aquesta acció no es pot desfer (fes una exportació abans, si cal).`)) return;
  mut(() => {
    C().reptes = C().reptes.filter(r => r.id !== id);
    if (C().actual === id) C().actual = C().reptes[0]?.id ?? null;
    if (vista === "repte:" + id) vista = "contingut";
  });
}

/* ---- Grups-aula (mòdul + grup): nivell superior, multimòdul i multigrup ---- */
function anarPrimeraVistaDelCurs() {
  vista = "avaluar"; avaluaRASel = null; avaluaRepteSel = null;
  subRepte = "tauler"; subRA = "categories";
  raActiuUI = null; selActivitats.clear();
  filtreCatAct = ""; cercaAct = ""; filtreEsborrany = ""; filtreCatAvalua = ""; actAvaluant = null;
  filtreContingutsRA = ""; cercaContinguts = "";
}
function canviaCurs(id) {
  mut(() => { state.cursActual = id; anarPrimeraVistaDelCurs(); });
}
async function nouCurs() {
  const modul = await promptModal("Nom del nou mòdul professional (p. ex. «MP7 Desenvolupament web en entorn client»):");
  if (!modul || !modul.trim()) return;
  const grup = await promptModal("Nom del grup-aula (p. ex. «2n DAW A»):", "Grup 1");
  if (grup === null) return;
  mut(() => {
    const nou = nouCursBuit(modul.trim(), (grup || "Grup 1").trim());
    state.cursos.push(nou);
    state.cursActual = nou.id;
    anarPrimeraVistaDelCurs();
  });
}
async function duplicaCurs(id) {
  const orig = state.cursos.find(c => c.id === id);
  const grup = await promptModal(`Nom del nou grup-aula per al mateix mòdul (${orig.modul}). Es copiaran l'estructura de RA, reptes, instruments, rúbriques i categories, però no l'alumnat ni les notes.`, orig.grup + " (còpia)");
  if (!grup || !grup.trim()) return;
  mut(() => {
    const nou = deep(orig);
    nou.id = uid();
    nou.grup = grup.trim();
    nou.alumnes = [];
    nou.reptes.forEach(r => { r.equips = []; r.avaluacions = { equip: {}, factors: {}, individual: {} }; });
    nou.notesDirectes = {};
    Object.values(nou.activitatsRA).forEach(d => d.activitats.forEach(a => { a.notes = {}; }));
    state.cursos.push(nou);
    state.cursActual = nou.id;
    anarPrimeraVistaDelCurs();
  });
}
async function esborraCurs(id) {
  if (state.cursos.length === 1) { await alertModal("No pots esborrar l'últim grup-aula."); return; }
  const curs = state.cursos.find(c => c.id === id);
  if (!await confirmModal(`Esborrar el grup-aula «${curs.modul} · ${curs.grup}» amb tot el seu alumnat, reptes i notes? Aquesta acció no es pot desfer (fes una exportació abans, si cal).`)) return;
  mut(() => {
    state.cursos = state.cursos.filter(c => c.id !== id);
    if (state.cursActual === id) { state.cursActual = state.cursos[0].id; anarPrimeraVistaDelCurs(); }
  });
}

/* ---- Gestió d'activitats: selecció múltiple, filtres i reassignació d'RA/categoria ---- */
let selActivitats = new Set();   // ids d'activitat marcades (per a accions en bloc)
let filtreCatAct = "";           // filtre per categoria dins la gestió
let cercaAct = "";               // cerca de text dins la gestió
let filtreEsborrany = "";        // "", "si", "no"

function activitatsFiltrades(raId) {
  const d = C().activitatsRA[raId];
  const q = cercaAct.trim().toLowerCase();
  return d.activitats.filter(a =>
    (!filtreCatAct || a.categoriaId === filtreCatAct)
    && (!filtreEsborrany || (filtreEsborrany === "si" ? !!a.esborrany : !a.esborrany))
    && (!q || a.nom.toLowerCase().includes(q)));
}
function filtraAct(el) {
  cercaAct = el.value;

  render();

function toggleSelAct(id, on) { if (on) selActivitats.add(id); else selActivitats.delete(id); render(); }
function toggleSelTotes(raId, on) {
  const vis = activitatsFiltrades(raId);
  if (on) vis.forEach(a => selActivitats.add(a.id)); else vis.forEach(a => selActivitats.delete(a.id));

      <button class="btn pri" onclick="novaActivitat('${raId}')" ${!d.categories.length ? "disabled" : ""}>+ Afegeix activitat</button></div>

      ${vis.map(a => {

        <td><select onchange="mut(()=>{C().activitatsRA['${raId}'].activitats[${ai}].categoriaId=this.value})">

}
function activitatsSeleccionades(raId) {
  return C().activitatsRA[raId].activitats.filter(a => selActivitats.has(a.id));
}
async function bulkCategoria(raId) {
  const d = C().activitatsRA[raId];
  const catId = await selectModal("A quina categoria vols moure les activitats seleccionades?", d.categories.map(x => ({ valor: x.id, etiqueta: x.nom })));
  if (!catId) return;
  mut(() => activitatsSeleccionades(raId).forEach(a => { a.categoriaId = catId; }));
  selActivitats.clear(); render();
}
async function bulkTipus(raId) {
  const t = await selectModal("Com s'han d'avaluar les activitats seleccionades?",
    [{ valor: "nota", etiqueta: "Nota (0–10)" }, { valor: "fetnofet", etiqueta: "Fet / No fet" }]);
  if (!t) return;
  mut(() => activitatsSeleccionades(raId).forEach(a => { a.tipus = t; }));
  selActivitats.clear(); render();
}
async function bulkMouRA(raId) {
  const altres = C().config.ras.filter(r => r.id !== raId && raMode(r) === "activitats");
  const destiRA = await selectModal("A quin RA vols moure les activitats seleccionades?\n(La categoria es buscarà pel mateix nom al RA de destí, i es crearà si no hi és.)",
    altres.map(r => ({ valor: r.id, etiqueta: r.nom })));
  if (!destiRA) return;
  const origen = C().activitatsRA[raId];
  const desti = C().activitatsRA[destiRA] || (C().activitatsRA[destiRA] = { categories: [], activitats: [] });
  const mogudes = activitatsSeleccionades(raId);
  mut(() => {
    for (const a of mogudes) {
      const catOrig = origen.categories.find(x => x.id === a.categoriaId);
      let catDesti = desti.categories.find(x => catOrig && x.nom.toLowerCase() === catOrig.nom.toLowerCase());
      if (!catDesti) {
        catDesti = { id: uid(), nom: catOrig ? catOrig.nom : "Sense categoria", pes: 0, minim: null, classroomId: catOrig ? catOrig.classroomId : null };
        desti.categories.push(catDesti);
      }
      a.categoriaId = catDesti.id;
      desti.activitats.push(a);
    }
    origen.activitats = origen.activitats.filter(a => !selActivitats.has(a.id));
  });
  selActivitats.clear();
  await alertModal(`${mogudes.length} activitat/s moguda/es a «${raNom(destiRA)}». Revisa'n els pesos de categoria als dos RA.`);
}
async function bulkEsborra(raId) {
  const n = activitatsSeleccionades(raId).length;
  if (!await confirmModal(`Esborrar ${n} activitat/s i totes les seves notes? No es pot desfer.`)) return;
  mut(() => { const d = C().activitatsRA[raId]; d.activitats = d.activitats.filter(a => !selActivitats.has(a.id)); });
  selActivitats.clear(); render();
}

/* ---- Avaluació d'activitats: mode graella (tot) o mode focus (una activitat) ---- */
let modeAvalua = "focus";   // "focus" | "graella"
let actAvaluant = null;     // id de l'activitat en mode focus
let filtreCatAvalua = "";

function vAvaluarActivitats(raId) {
  const d = C().activitatsRA[raId] || (C().activitatsRA[raId] = { categories: [], activitats: [] });
  if (!d.activitats.length) {
    return `<p class="lead">Introdueix aquí la nota de cada alumne a cada activitat.</p>
      <div class="avis">Encara no hi ha activitats per avaluar. Crea'n a la subpestanya <b>Activitats</b>.</div>`;
  }
  const llista = d.activitats.filter(a => !filtreCatAvalua || a.categoriaId === filtreCatAvalua);
  if (!llista.some(a => a.id === actAvaluant)) actAvaluant = llista[0]?.id ?? null;
  const capcalera = `
  <div class="toolrow" style="margin-bottom:14px">
    <select onchange="filtreCatAvalua=this.value;actAvaluant=null;render()">
      <option value="">Totes les categories</option>
      ${d.categories.map(x => `<option value="${x.id}" ${filtreCatAvalua === x.id ? "selected" : ""}>${esc(x.nom)}</option>`).join("")}
    </select>
    <span class="spacer"></span>
    <button class="btn mini ${modeAvalua === "focus" ? "pri" : ""}" onclick="modeAvalua='focus';render()">Una activitat</button>
    <button class="btn mini ${modeAvalua === "graella" ? "pri" : ""}" onclick="modeAvalua='graella';render()">Graella completa</button>
  </div>`;
  return capcalera + (modeAvalua === "focus" ? vAvaluaFocus(raId, d, llista) : vAvaluaGraella(raId, d, llista));
}
/* Mode focus: una sola activitat, una fila per alumne. Enter salta a l'alumne següent. */
function vAvaluaFocus(raId, d, llista) {
  if (!llista.length) return `<div class="avis">Cap activitat en aquesta categoria.</div>`;
  const a = d.activitats.find(x => x.id === actAvaluant);
  const posades = C().alumnes.filter(al => valorActivitat(a, al.id) !== null).length;
  const total = C().alumnes.length;
  return `
  <div class="card">
    <div class="toolrow" style="margin-bottom:12px">
      <select onchange="actAvaluant=this.value;render()" style="max-width:340px">
        ${llista.map(x => {
          const fetes = C().alumnes.filter(al => valorActivitat(x, al.id) !== null).length;
          return `<option value="${x.id}" ${x.id === actAvaluant ? "selected" : ""}>${esc(x.nom)} (${fetes}/${total})</option>`;
        }).join("")}
      </select>
      <span class="badge b-blau">${esc((d.categories.find(c => c.id === a.categoriaId) || {}).nom || "—")}</span>
      ${a.esborrany ? '<span class="badge b-draft">esborrany</span>' : ""}
      <span class="spacer"></span>

    ${a.rubrica ? taulaRubrica(raId, a) : `
    <table style="max-width:560px">
      <tr><th>Alumne/a</th><th class="num" style="width:130px">${a.tipus === "fetnofet" ? "Fet" : "Nota"}</th></tr>
      ${C().alumnes.map((al, i) => {
        const v = a.notes[al.id];
        const buida = v === undefined || v === null || v === "";
        return `<tr><td><a class="nom-clic" onclick="anar('alumne:${al.id}')" title="Veure la fitxa de ${esc(al.nom)}">${esc(al.nom)}</a></td>
        <td class="num ${buida && a.tipus !== "fetnofet" ? "cel-buida" : ""}">${a.tipus === "fetnofet"
          ? `<input type="checkbox" ${v ? "checked" : ""} onchange="posaNotaActivitat('${raId}','${a.id}','${al.id}',this.checked)">`
          : `<input class="nota nota-focus" data-i="${i}" type="number" min="0" max="10" step="0.1" value="${v ?? ""}"
              onchange="posaNotaActivitat('${raId}','${a.id}','${al.id}',this.value)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();saltaAlumne(${i});}">`}</td></tr>`;
      }).join("")}
    </table>`}
  </div>`;
}
/* Avaluació per rúbrica importada de Classroom: un desplegable de nivells per criteri i alumne.
   La nota surt de la suma de punts dels nivells triats, escalada a 0–10. */
function puntsMaxRubrica(rub) {
  return rub.criteris.reduce((s, cr) => s + Math.max(...cr.nivells.map(n => Number(n.punts) || 0), 0), 0);
}
function taulaRubrica(raId, a) {
  const rub = a.rubrica, maxTot = puntsMaxRubrica(rub);
  const senseP = maxTot <= 0; // rúbrica sense punts: serveix de guia, la nota s'entra a mà
  return `
  <p class="tiny mut" style="margin-bottom:8px">Rúbrica importada de Classroom (${rub.criteris.length} criteris${senseP ? ", sense punts" : `, ${maxTot} punts`}).
  ${senseP ? "Com que els nivells no tenen punts, fes servir la rúbrica com a guia i introdueix la nota a mà." : "La nota es calcula sola a partir dels nivells triats."}</p>
  <div style="overflow-x:auto"><table>
    <tr><th class="sticky-nom">Alumne/a</th>
      ${rub.criteris.map(cr => `<th title="${esc(cr.descripcio || "")}">${esc(cr.titol || "Criteri")}</th>`).join("")}
      <th class="num" style="width:110px">Nota</th></tr>
    ${C().alumnes.map((al, i) => {
      const sel = (a.rubricaSel || {})[al.id] || {};
      const v = a.notes[al.id];
      return `<tr><td class="sticky-nom"><a class="nom-clic" onclick="anar('alumne:${al.id}')" title="Veure la fitxa de ${esc(al.nom)}">${esc(al.nom)}</a></td>
      ${rub.criteris.map((cr, ci) => `<td><select onchange="triaNivellRubrica('${raId}','${a.id}','${al.id}',${ci},this.value)">
        <option value="">—</option>
        ${cr.nivells.map((n, ni) => `<option value="${ni}" ${String(sel[ci]) === String(ni) ? "selected" : ""}>${esc(n.titol || ("Nivell " + (ni + 1)))}${n.punts != null ? ` (${n.punts})` : ""}</option>`).join("")}
      </select></td>`).join("")}
      <td class="num ${v === undefined ? "cel-buida" : ""}">${senseP
        ? `<input class="nota nota-focus" data-i="${i}" type="number" min="0" max="10" step="0.1" value="${v ?? ""}"
             onchange="posaNotaActivitat('${raId}','${a.id}','${al.id}',this.value)">`
        : (v === undefined ? '<span class="mut">—</span>' : `<span class="nota-final">${fmt(Number(v))}</span>`)}</td>
      </tr>`;
    }).join("")}
  </table></div>`;
}
function triaNivellRubrica(raId, actId, alId, criteriIdx, nivellIdx) {
  mut(() => {
    const a = C().activitatsRA[raId].activitats.find(x => x.id === actId);
    if (!a.rubricaSel) a.rubricaSel = {};
    if (!a.rubricaSel[alId]) a.rubricaSel[alId] = {};
    if (nivellIdx === "") delete a.rubricaSel[alId][criteriIdx];
    else a.rubricaSel[alId][criteriIdx] = Number(nivellIdx);
    const maxTot = puntsMaxRubrica(a.rubrica);
    if (maxTot <= 0) return; // rúbrica sense punts: la nota l'entra el docent
    const sel = a.rubricaSel[alId];
    if (!Object.keys(sel).length) { delete a.notes[alId]; return; }
    let punts = 0;
    a.rubrica.criteris.forEach((cr, ci) => {
      const ni = sel[ci];
      if (ni !== undefined && cr.nivells[ni]) punts += Number(cr.nivells[ni].punts) || 0;
    });
    a.notes[alId] = clamp(Math.round((punts / maxTot) * 100) / 10, 0, 10);
  });
}
function saltaAlumne(i) {
  const seguent = document.querySelector(`.nota-focus[data-i="${i + 1}"]`);
  if (seguent) { seguent.focus(); seguent.select(); }
}
function omplebuits(raId, actId, valor) {
  mut(() => {

}
function omplebuitsNota(raId, actId) {

}
/* Mode graella: totes les activitats visibles alhora, amb el nom d'alumne fixat a l'esquerra. */
function vAvaluaGraella(raId, d, llista) {

  <div class="card graella-wrap">

/* ---- reordenació d'activitats per arrossegament ----
   L'ordre viu a l'array d.activitats, així que val per a totes les vistes de l'RA.
   Només s'activa sense filtre de categoria: amb filtre, "deixar-ho aquí" seria ambigu. */
let arrossegantAct = null;
function arrossegaIni(ev, actId) {
  arrossegantAct = actId;
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", actId); } catch (e) { /* alguns navegadors ho exigeixen */ }
}
function arrossegaFi() {
  arrossegantAct = null;
  document.querySelectorAll(".drop-abans,.drop-despres").forEach(el => el.classList.remove("drop-abans", "drop-despres"));
}
function arrossegaSobre(ev, th) {
  if (!arrossegantAct) return;
  ev.preventDefault();
  const r = th.getBoundingClientRect();
  const abans = (ev.clientX - r.left) < r.width / 2;
  th.classList.toggle("drop-abans", abans);
  th.classList.toggle("drop-despres", !abans);
}
function arrossegaSolta(ev, raId, actIdDesti, th) {
  ev.preventDefault();
  const origen = arrossegantAct || ev.dataTransfer.getData("text/plain");
  arrossegaFi();
  if (!origen || origen === actIdDesti) return;
  const r = th.getBoundingClientRect();
  const abans = (ev.clientX - r.left) < r.width / 2;
  mut(() => {
    const llista = C().activitatsRA[raId].activitats;
    const i = llista.findIndex(a => a.id === origen);
    if (i < 0) return;
    const [mogut] = llista.splice(i, 1);
    let j = llista.findIndex(a => a.id === actIdDesti);
    if (j < 0) { llista.push(mogut); return; }
    llista.splice(abans ? j : j + 1, 0, mogut);
  });
}
async function ordenaComClassroom(raId) {
  const llista = C().activitatsRA[raId].activitats;
  if (!llista.some(a => a.ordreClassroom !== undefined)) {
    await alertModal("Cap activitat d'aquest RA ve de Classroom, així que no hi ha cap ordre original a restaurar.");
    return;
  }
  mut(() => {
    // les que no vénen de Classroom (creades a mà) van al final, mantenint el seu ordre relatiu
    C().activitatsRA[raId].activitats = llista
      .map((a, i) => ({ a, i }))
      .sort((p, q) => {
        const op = p.a.ordreClassroom ?? Infinity, oq = q.a.ordreClassroom ?? Infinity;
        return op !== oq ? op - oq : p.i - q.i;
      })
      .map(x => x.a);
  });
}
function colorNota(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return "";
  return n < 4 ? "n-baix" : n < 5 ? "n-just" : "n-ok";
}
function novaCategoria(raId) {
  mut(() => { C().activitatsRA[raId].categories.push({ id: uid(), nom: "Nova categoria", pes: 0, minim: null }); });
}
async function esborraCategoria(raId, catId) {
