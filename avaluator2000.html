  });
}

/* ---- Importació des de Google Classroom (només disponible desplegat com a app de Google) ---- */
/* Tria de curs amb desplegable: mostra nom i secció, sense haver d'escriure cap número ni id. */
async function triaCursClassroom(cursos, text) {
  return await selectModal(text, cursos.map(c => ({ valor: c.id, etiqueta: c.nom, sub: c.seccio || "" })));
}

async function obreImportAlumnesClassroom() {
  if (!enGAS) return;
  try {
    setEstat("saving", "Consultant Classroom…");
    const cursos = await gasCrida("llistaCursosClassroom");
    if (!cursos.length) { await alertModal("No s'ha trobat cap curs actiu a Classroom amb aquest compte de Google."); render(); return; }
    const courseId = await triaCursClassroom(cursos, "De quin curs de Classroom vols importar l'alumnat?");
    if (!courseId) { render(); return; }
    const curs = cursos.find(c => c.id === courseId);
    const alumnesC = await gasCrida("importaAlumnesClassroom", courseId);
    let noves = 0;
    mut(() => {
      for (const ac of alumnesC) {
        const existent = C().alumnes.find(a => a.classroomId === ac.classroomId);
        if (existent) existent.nom = ac.nom;
        else { C().alumnes.push({ id: uid(), nom: ac.nom, classroomId: ac.classroomId }); noves++; }
      }
    });
    await alertModal(`Importació completa de «${curs.nom}»: ${alumnesC.length} alumnes trobats (${noves} de nous). No s'ha esborrat ningú.`);
  } catch (e) { await alertModal("Error important de Classroom: " + e); render(); }
}
async function obreImportClassroom(raId) {
  if (!enGAS) return;
  try {
    setEstat("saving", "Consultant Classroom…");
    const cursos = await gasCrida("llistaCursosClassroom");
    if (!cursos.length) { await alertModal("No s'ha trobat cap curs actiu a Classroom amb aquest compte de Google."); render(); return; }
    const courseId = await triaCursClassroom(cursos, "De quin curs vols importar les tasques (activitats)?");
    if (!courseId) { render(); return; }
    const curs = cursos.find(c => c.id === courseId);
    const d = C().activitatsRA[raId];
    if (!d.categories.length) { await alertModal("Crea primer una categoria per assignar-hi les activitats importades."); render(); return; }
    const categoriaPerDefecte = await selectModal(
      "A quina categoria aniran les tasques SENSE categoria a Classroom?\n(Les que en tinguin s'assignaran a la categoria equivalent d'aquest RA, creant-la si cal.)",
      d.categories.map(x => ({ valor: x.id, etiqueta: x.nom })));
    if (!categoriaPerDefecte) { render(); return; }
    const treballs = await gasCrida("importaActivitatsClassroom", courseId);
    let noves = 0, catsNoves = 0, notesNoves = 0;
    const mapaAlumnes = {};
    C().alumnes.forEach(a => { if (a.classroomId) mapaAlumnes[a.classroomId] = a.id; });
    mut(() => {
      for (const t of treballs) {
        const catId = resolCategoria(d, t, categoriaPerDefecte, () => catsNoves++);
        const deClassroom = notesDesDeClassroom(t, mapaAlumnes);
        const existent = d.activitats.find(a => a.classroomId === t.classroomId);
        if (existent) {
          existent.nom = t.nom; existent.esborrany = !!t.esborrany;
          if (t.rubrica) existent.rubrica = t.rubrica;
          if (!existent.categoriaId) existent.categoriaId = catId;
          // no es trepitgen les notes que ja hi hagi a l'app: només s'omplen els buits
          for (const [alId, v] of Object.entries(deClassroom)) {
            if (existent.notes[alId] === undefined) { existent.notes[alId] = v; notesNoves++; }
          }
        } else {
          d.activitats.push({ id: uid(), nom: t.nom, categoriaId: catId, ordreClassroom: treballs.indexOf(t), tipus: t.maxPoints ? "nota" : "fetnofet",
            classroomId: t.classroomId, esborrany: !!t.esborrany, rubrica: t.rubrica || null, rubricaSel: {}, notes: deClassroom });
          noves++; notesNoves += Object.keys(deClassroom).length;
        }
      }
    });
    const draftsN = treballs.filter(t => t.esborrany).length;
    await alertModal(`Importació completa de «${curs.nom}»: ${treballs.length} tasques trobades (${noves} de noves${draftsN ? `, ${draftsN} en esborrany` : ""})${catsNoves ? `, ${catsNoves} categoria/es creada/es` : ""}${notesNoves ? `, ${notesNoves} notes importades de Classroom` : ""}. No s'ha esborrat ni sobreescrit cap nota que ja tinguessis.`);
  } catch (e) { await alertModal("Error important de Classroom: " + e); render(); }
}
/* Passa les notes ja posades a Classroom a l'escala 0–10 de l'app.
   Classroom puntua sobre maxPoints (p. ex. 20), així que es reescala; les tasques sense
   maxPoints (Fet/No fet) es marquen com a fetes si tenen qualsevol nota registrada.
   mapaAlumnes: classroomUserId -> id d'alumne dins l'app. */
function notesDesDeClassroom(treball, mapaAlumnes) {
  const dest = {};
  const fetNoFet = !treball.maxPoints;
  for (const [userId, info] of Object.entries(treball.notes || {})) {
    const alId = mapaAlumnes[userId];
    if (!alId) continue;
    dest[alId] = fetNoFet ? true : clamp(Math.round((Number(info.punts) / treball.maxPoints) * 100) / 10, 0, 10);
  }
  return dest;
}
function comptaNotesImportades(activitats) {
  return activitats.reduce((s, t) => s + Object.keys(t.notes || {}).length, 0);
}

/* Troba (o crea) dins d'un RA la categoria equivalent a la que la tasca té a Classroom.
   Es lliga per classroomId i, si no, pel nom; si la tasca no en té cap, cau a la de per defecte. */
function resolCategoria(d, treball, categoriaPerDefecte, onCrea) {
  if (!treball.categoriaClassroomId && !treball.categoriaNom) return categoriaPerDefecte;
  let cat = d.categories.find(c => c.classroomId && c.classroomId === treball.categoriaClassroomId)
    || d.categories.find(c => treball.categoriaNom && c.nom.toLowerCase() === treball.categoriaNom.toLowerCase());
  if (cat) { if (!cat.classroomId) cat.classroomId = treball.categoriaClassroomId; return cat.id; }
  cat = { id: uid(), nom: treball.categoriaNom || "Categoria", pes: 0, minim: null, classroomId: treball.categoriaClassroomId };
  d.categories.push(cat);
  if (onCrea) onCrea();
  return cat.id;
}
/* Crea un grup-aula sencer a partir d'un curs de Google Classroom:
   alumnat + categories de qualificació (amb el seu pes) + tasques amb la categoria assignada. */
/* ================= Sincronització amb Classroom =================
   Reimporta el curs ja vinculat i concilia temes→RA, tasques→activitats, alumnat i notes.
   Sempre additiva: res del que hagis fet a l'app s'esborra; el que ha desaparegut de
   Classroom només es marca, perquè esborrar-ho podria fer perdre notes. */
async function sincronitzaClassroom() {
  if (!enGAS) return;
  try {
    let courseId = C().classroomCourseId;
    setEstat("saving", "Consultant Classroom…");
    const cursos = await gasCrida("llistaCursosClassroom");
    if (!cursos.length) { await alertModal("No s'ha trobat cap curs actiu a Classroom amb aquest compte."); render(); return; }
    if (!courseId || !cursos.some(x => x.id === courseId)) {
      courseId = await triaCursClassroom(cursos, "Aquest grup-aula encara no està vinculat a cap curs de Classroom.\nAmb quin el vols sincronitzar?");
      if (!courseId) { render(); return; }
    }
    const qNotes = await selectModal("Què vull fer amb les notes que ja tinc a l'aplicació?", [
      { valor: "buits", etiqueta: "Només omplir els buits", sub: "no toca el que ja has posat" },
      { valor: "sobre", etiqueta: "Sobreescriure amb les de Classroom", sub: "Classroom mana" },
    ], { valorInicial: "buits" });
    if (!qNotes) { render(); return; }

    setEstat("saving", "Sincronitzant…");
    const dades = await gasCrida("importaCursClassroom", courseId);
    const c = C();

    /* ---- alumnat ---- */
    const perClassroomId = {};
    c.alumnes.forEach(a => { if (a.classroomId) perClassroomId[a.classroomId] = a; });
    const alumnesNous = dades.alumnes.filter(a => !perClassroomId[a.classroomId]);
    const alumnesRenom = dades.alumnes.filter(a => perClassroomId[a.classroomId] && perClassroomId[a.classroomId].nom !== a.nom);
    const idsClassroom = new Set(dades.alumnes.map(a => a.classroomId));
    const alumnesFora = c.alumnes.filter(a => a.classroomId && !idsClassroom.has(a.classroomId) && !a.foraClassroom);

    /* ---- temes → RA ---- */
    const grups = new Map();
    (dades.temes || []).forEach(t => grups.set(t.id, { clau: t.id, nom: t.nom, activitats: [] }));
    for (const t of dades.activitats) {
      const clau = t.temaId || "__sense__";
      if (!grups.has(clau)) grups.set(clau, { clau, nom: t.temaNom || "Sense tema", activitats: [] });
      grups.get(clau).activitats.push(t);
    }
    const ambFeina = [...grups.values()].filter(g => g.activitats.length);
    const raPerTema = new Map();   // clau de tema -> RA existent
    const raNous = [], raRenom = [];
    for (const g of ambFeina) {
      // 1r pel tema desat; 2n pel nom (per a grups-aula importats abans que es desés el tema)
      let ra = c.config.ras.find(r => r.classroomTopicId && r.classroomTopicId === g.clau)
        || c.config.ras.find(r => !r.classroomTopicId && raMode(r) === "activitats" && r.nom.trim().toLowerCase() === (g.nom || "").trim().toLowerCase());
      if (ra) {
        raPerTema.set(g.clau, ra);
        if (ra.nom !== g.nom && g.nom) raRenom.push({ ra, nou: g.nom });
      } else {
        // l'RA encara no existeix: el prepararem, però ja li donem id ara per poder-hi
        // assignar activitats en aquesta mateixa passada de planificació
        const ra = { id: uid(), nom: (g.nom || "").trim() || "Tema nou",
          classroomTopicId: g.clau === "__sense__" ? null : g.clau, pes: 0, mode: "activitats" };
        raNous.push({ g, ra });
        raPerTema.set(g.clau, ra);
      }
    }

    /* ---- activitats ---- */
    const actPerClassroomId = new Map();  // classroomId -> {raId, act}
    for (const [raId, d] of Object.entries(c.activitatsRA)) {
      (d.activitats || []).forEach(a => { if (a.classroomId) actPerClassroomId.set(a.classroomId, { raId, act: a }); });
    }
    const actNoves = [], actMogudes = [], actActualitzades = [];
    for (const g of ambFeina) {
      const raDesti = raPerTema.get(g.clau);
      for (const t of g.activitats) {
        const trobada = actPerClassroomId.get(t.classroomId);
        if (!trobada) { actNoves.push({ g, t }); continue; }
        if (raDesti && trobada.raId !== raDesti.id) actMogudes.push({ t, de: trobada.raId, a: raDesti.id, act: trobada.act });
        else if (trobada.act.nom !== t.nom || !!trobada.act.esborrany !== !!t.esborrany || (t.rubrica && !trobada.act.rubrica))
          actActualitzades.push({ t, ref: trobada });
      }
    }
    const idsCw = new Set(dades.activitats.map(t => t.classroomId));
    const actFora = [...actPerClassroomId.entries()].filter(([cid, v]) => !idsCw.has(cid) && !v.act.foraClassroom);

    /* ---- notes ---- */
    const mapaAl = {};
    c.alumnes.forEach(a => { if (a.classroomId) mapaAl[a.classroomId] = a.id; });
    dades.alumnes.forEach(a => { if (!mapaAl[a.classroomId]) mapaAl[a.classroomId] = null; }); // els nous es resolen en aplicar
    let notesCompte = 0;
    for (const t of dades.activitats) {
      const n = Object.keys(t.notes || {}).length;
      if (!n) continue;
      const trobada = actPerClassroomId.get(t.classroomId);
      if (!trobada) { notesCompte += n; continue; }
      for (const [userId, info] of Object.entries(t.notes)) {
        const alId = mapaAl[userId];
        if (alId === undefined) continue;
        if (alId === null) { notesCompte++; continue; }
        if (qNotes === "sobre" || trobada.act.notes[alId] === undefined) notesCompte++;
      }
    }

    const res = [];
    if (alumnesNous.length) res.push(`· ${alumnesNous.length} alumne/s nou/s`);
    if (alumnesRenom.length) res.push(`· ${alumnesRenom.length} nom/s d'alumne actualitzat/s`);
    if (alumnesFora.length) res.push(`· ${alumnesFora.length} alumne/s que ja no són a Classroom (es marcaran, no s'esborren)`);
    if (raNous.length) res.push(`· ${raNous.length} tema/es nou/s → es crearan com a RA: ${raNous.map(x => "«" + x.ra.nom + "»").join(", ")}`);
    if (raRenom.length) res.push(`· ${raRenom.length} RA es reanomenaran per seguir el tema`);
    if (actNoves.length) res.push(`· ${actNoves.length} activitat/s nova/es`);
    if (actMogudes.length) res.push(`· ${actMogudes.length} activitat/s que han canviat de tema (es mouran d'RA)`);
    if (actActualitzades.length) res.push(`· ${actActualitzades.length} activitat/s amb canvis (nom, esborrany o rúbrica)`);
    if (actFora.length) res.push(`· ${actFora.length} activitat/s que ja no són a Classroom (es marcaran, no s'esborren)`);
    if (notesCompte) res.push(`· ${notesCompte} nota/es ${qNotes === "sobre" ? "a sobreescriure" : "a omplir"}`);
    if (!res.length) { await alertModal(`Tot està al dia: no hi ha cap canvi a portar de «${dades.nom}».`); render(); return; }
    if (!await confirmModal(`Sincronitzar amb «${dades.nom}»?\n\n${res.join("\n")}\n\nNo s'esborrarà res del que tinguis a l'aplicació.`)) { render(); return; }

    /* ---- aplicar ---- */
    mut(() => {
      const c = C();
      c.classroomCourseId = courseId;
      // alumnat
      alumnesNous.forEach(a => c.alumnes.push({ id: uid(), nom: a.nom, classroomId: a.classroomId }));
      alumnesRenom.forEach(a => { const ex = c.alumnes.find(x => x.classroomId === a.classroomId); if (ex) ex.nom = a.nom; });
      alumnesFora.forEach(a => { a.foraClassroom = true; });
      const mapa = {};
      c.alumnes.forEach(a => { if (a.classroomId) mapa[a.classroomId] = a.id; });
      // RA nous i reanomenats
      raRenom.forEach(({ ra, nou }) => { ra.nom = nou; });
      for (const { ra } of raNous) {
        c.config.ras.push(ra);
        c.activitatsRA[ra.id] = { categories: [], activitats: [] };
      }
      // deixa desat el tema als RA que s'havien lligat pel nom
      for (const [clau, ra] of raPerTema) if (!ra.classroomTopicId && clau !== "__sense__") ra.classroomTopicId = clau;

      const catsCurs = dades.categories || [];
      const categoriaPer = (d, t) => {
        if (!t.categoriaClassroomId && !t.categoriaNom) {
          let cap = d.categories.find(x => x.nom === "Sense categoria");
          if (!cap) { cap = { id: uid(), nom: "Sense categoria", pes: 0, minim: null, classroomId: null }; d.categories.push(cap); }
          return cap.id;
        }
        let cat = d.categories.find(x => x.classroomId && x.classroomId === t.categoriaClassroomId)
          || d.categories.find(x => t.categoriaNom && x.nom.toLowerCase() === t.categoriaNom.toLowerCase());
        if (!cat) {
          const orig = catsCurs.find(x => x.classroomId === t.categoriaClassroomId);
          cat = { id: uid(), nom: t.categoriaNom || (orig ? orig.nom : "Categoria"), pes: orig ? orig.pes : 0, minim: null, classroomId: t.categoriaClassroomId };
          d.categories.push(cat);
        }
        return cat.id;
      };
      const aplicaNotes = (act, t) => {
        for (const [userId, info] of Object.entries(t.notes || {})) {
          const alId = mapa[userId];
          if (!alId) continue;
          const v = t.maxPoints ? clamp(Math.round((Number(info.punts) / t.maxPoints) * 100) / 10, 0, 10) : true;
          if (qNotes === "sobre" || act.notes[alId] === undefined) act.notes[alId] = v;
        }
      };
      // activitats mogudes d'RA
      for (const m of actMogudes) {
        const origen = c.activitatsRA[m.de], desti = c.activitatsRA[m.a];
        origen.activitats = origen.activitats.filter(x => x.id !== m.act.id);
        m.act.categoriaId = categoriaPer(desti, m.t);
        m.act.nom = m.t.nom; m.act.esborrany = !!m.t.esborrany;
        if (m.t.rubrica) m.act.rubrica = m.t.rubrica;
        aplicaNotes(m.act, m.t);
        desti.activitats.push(m.act);
      }
      // activitats actualitzades
      for (const u of actActualitzades) {
        u.ref.act.nom = u.t.nom;
        u.ref.act.esborrany = !!u.t.esborrany;
        if (u.t.rubrica) u.ref.act.rubrica = u.t.rubrica;
      }
      // notes de les que ja existien i no s'han mogut
      for (const t of dades.activitats) {
        const trobada = actPerClassroomId.get(t.classroomId);
        if (trobada && !actMogudes.some(m => m.act.id === trobada.act.id)) aplicaNotes(trobada.act, t);
      }
      // activitats noves
      for (const { g, t } of actNoves) {
        const ra = raPerTema.get(g.clau);
        if (!ra) continue;
        const d = c.activitatsRA[ra.id] || (c.activitatsRA[ra.id] = { categories: [], activitats: [] });
        const act = { id: uid(), nom: t.nom, categoriaId: categoriaPer(d, t), ordreClassroom: dades.activitats.indexOf(t), tipus: t.maxPoints ? "nota" : "fetnofet",
          classroomId: t.classroomId, esborrany: !!t.esborrany, rubrica: t.rubrica || null, rubricaSel: {}, notes: {} };
        aplicaNotes(act, t);
        d.activitats.push(act);
      }
      // el que ja no hi és a Classroom: només es marca
      actFora.forEach(([cid, v]) => { v.act.foraClassroom = true; });
    });
    await alertModal(`Sincronització feta amb «${dades.nom}».\n\n${res.join("\n")}`);
  } catch (e) { await alertModal("Error sincronitzant amb Classroom: " + e); render(); }
}

async function nouCursDesDeClassroom() {
  if (!enGAS) return;
  try {
    setEstat("saving", "Consultant Classroom…");
    const cursos = await gasCrida("llistaCursosClassroom");
    if (!cursos.length) { await alertModal("No s'ha trobat cap curs actiu a Classroom amb aquest compte de Google."); render(); return; }
    const courseId = await triaCursClassroom(cursos, "De quin curs de Classroom vols crear un grup-aula nou?");
    if (!courseId) { render(); return; }
    setEstat("saving", "Important el curs… (pot trigar una mica si hi ha rúbriques)");
    const dades = await gasCrida("importaCursClassroom", courseId);

    /* Un RA per tema de Classroom. Les tasques sense tema van a un RA "Sense tema".
       Cada RA té la seva còpia de les categories de qualificació que les seves tasques facin servir,
       conservant el pes que tenen a Classroom. */
    const grups = [];                       // [{clau, nom, activitats[]}]
    const perClau = new Map();
    const grupDe = (clau, nom) => {
      if (!perClau.has(clau)) { const g = { clau, nom, activitats: [] }; perClau.set(clau, g); grups.push(g); }
      return perClau.get(clau);
    };
    // Primer els temes en l'ordre de Classroom, perquè els RA surtin ordenats com al curs
    (dades.temes || []).forEach(t => grupDe(t.id, t.nom));
    for (const t of dades.activitats) grupDe(t.temaId || "__sense__", t.temaNom || "Sense tema").activitats.push(t);
    // Temes buits: no generen RA
    const ambFeina = grups.filter(g => g.activitats.length);
    if (!ambFeina.length) ambFeina.push({ clau: "__sense__", nom: "Resultat d'aprenentatge 1", activitats: [] });

    const catsCurs = dades.categories || [];
    const pesRA = Math.round(100 / ambFeina.length);
    const ras = [], activitatsRA = {};
    ambFeina.forEach((g, i) => {
      const raId = uid(); // clau interna; de cara a l'usuari l'RA només té nom
      g.raId = raId;
      // pes: repartit a parts iguals, i l'últim absorbeix el residu perquè sumi 100 exacte
      // si el tema de Classroom no té nom, l'RA es queda amb el seu propi codi com a nom
      // el nom de l'RA és el nom del tema de Classroom
      // es desa el tema de Classroom que representa aquest RA: és el que permet resincronitzar després
      ras.push({ id: raId, nom: (g.nom || "").trim() || `Tema ${i + 1}`, classroomTopicId: g.clau === "__sense__" ? null : g.clau,
        pes: i === ambFeina.length - 1 ? 100 - pesRA * (ambFeina.length - 1) : pesRA, mode: "activitats" });
      const d = { categories: [], activitats: [] };
      let capCategoria = null;
      const senseCategoria = () => {
        if (!capCategoria) { capCategoria = { id: uid(), nom: "Sense categoria", pes: 0, minim: null, classroomId: null }; d.categories.push(capCategoria); }
        return capCategoria.id;
      };
      for (const t of g.activitats) {
        let catId;
        if (t.categoriaClassroomId || t.categoriaNom) {
          // la categoria es copia dins d'aquest RA amb el pes que tenia a Classroom
          let cat = d.categories.find(x => x.classroomId && x.classroomId === t.categoriaClassroomId)
            || d.categories.find(x => t.categoriaNom && x.nom.toLowerCase() === (t.categoriaNom || "").toLowerCase());
          if (!cat) {
            const orig = catsCurs.find(x => x.classroomId === t.categoriaClassroomId);
            cat = { id: uid(), nom: t.categoriaNom || (orig ? orig.nom : "Categoria"), pes: orig ? orig.pes : 0, minim: null, classroomId: t.categoriaClassroomId };
            d.categories.push(cat);
          }
          catId = cat.id;
        } else catId = senseCategoria();
        d.activitats.push({
          id: uid(), nom: t.nom, categoriaId: catId, ordreClassroom: dades.activitats.indexOf(t),
          tipus: t.maxPoints ? "nota" : "fetnofet",
          classroomId: t.classroomId, esborrany: !!t.esborrany,
          rubrica: t.rubrica || null, rubricaSel: {}, notes: {},
        });
      }
      activitatsRA[raId] = d;
    });

    const alumnesApp = dades.alumnes.map(a => ({ id: uid(), nom: a.nom, classroomId: a.classroomId }));
    const mapaAlumnes = {};
    alumnesApp.forEach(a => { mapaAlumnes[a.classroomId] = a.id; });
    // les notes ja posades a Classroom (publicades o en esborrany) es porten cap a les activitats
    ambFeina.forEach(g => g.activitats.forEach(t => {
      const act = activitatsRA[g.raId].activitats.find(x => x.classroomId === t.classroomId);
      if (act) act.notes = notesDesDeClassroom(t, mapaAlumnes);
    }));

    mut(() => {
      const nou = nouCursBuit(dades.nom, dades.seccio || "Grup 1");
      nou.classroomCourseId = dades.courseId;
      nou.alumnes = alumnesApp;
      nou.reptes = []; // un curs importat de Classroom arrenca sense reptes: tot són activitats
      nou.config.ras = ras;
      nou.activitatsRA = activitatsRA;
      state.cursos.push(nou);
      state.cursActual = nou.id;
      anarPrimeraVistaDelCurs();
    });

    const totalAct = ambFeina.reduce((s, g) => s + g.activitats.length, 0);
    const totalEsb = dades.activitats.filter(a => a.esborrany).length;
    const ambRubrica = dades.activitats.filter(a => a.rubrica).length;
    const senseTema = dades.activitats.filter(a => !a.temaId).length;
    const catsFora = ras.map(r => {
      const suma = activitatsRA[r.id].categories.reduce((s, x) => s + (Number(x.pes) || 0), 0);
      return suma === 100 ? null : `«${r.nom}» (${suma}%)`;
    }).filter(Boolean);
    await alertModal(
      `Grup-aula creat des de «${dades.nom}»:\n`
      + `· ${dades.alumnes.length} alumnes\n`
      + `· ${ras.length} RA, un per cada tema de Classroom (amb el nom del tema)\n`
      + `· ${totalAct} activitats${totalEsb ? ` (${totalEsb} en esborrany)` : ""}${ambRubrica ? `, ${ambRubrica} amb rúbrica` : ""}\n`
      + `· ${comptaNotesImportades(dades.activitats)} notes ja posades a Classroom, importades\n`
      + (senseTema ? `· ${senseTema} tasques sense tema han anat a l'RA «Sense tema»\n` : "")
      + `\nEl pes de cada RA s'ha repartit a parts iguals: ajusta'l a Configuració si cal.`
      + (catsFora.length ? `\n\nLes categories no sumen 100% a: ${catsFora.join(", ")}. Classroom reparteix el pes entre totes les categories del curs, així que en separar-les per tema cal reajustar-les.` : ""));
  } catch (e) { await alertModal("Error important de Classroom: " + e); render(); }
}

/* ---- RA en mode "directe": pàgina pròpia, sense subpestanyes ---- */
async function canviaModeRA(raId, mode) {
  const ra = raConf(raId);
  if (mode === "reptes" && C().reptes.some(r => r.ras.includes(raId))) {
    // ja hi ha reptes que el treballen: no cal avisar, simplement reprèn aquest mode
  } else if (ra.mode === "reptes" && mode !== "reptes" && C().reptes.some(r => r.ras.includes(raId))) {
    if (!await confirmModal(`Hi ha reptes que treballen «${raNom(raId)}». Si canvies de mode, deixaran de comptar-hi (no s'esborren, però caldrà desmarcar-los manualment si vols reassignar-los). Continuar?`)) { render(); return; }
  }
  mut(() => {
    ra.mode = mode;
    ra.directe = mode === "directe"; // es manté per compatibilitat amb exportacions anteriors
    if (mode === "activitats" && !C().activitatsRA[raId]) C().activitatsRA[raId] = { categories: [], activitats: [] };
  });
}
async function afegeixRA() {
  const nom = await promptModal("Nom del nou resultat d'aprenentatge:");
  if (!nom || !nom.trim()) return;
  mut(() => {
    const id = uid(); // clau interna, no es mostra mai
    C().config.ras.push({ id, nom: nom.trim(), pes: 0, mode: "activitats" });
    C().activitatsRA[id] = { categories: [], activitats: [] };
  });
}
async function esborraRA(id) {
  const ra = raConf(id);
  if (!await confirmModal(`Esborrar el resultat d'aprenentatge «${ra.nom}»? Es traurà de qualsevol repte que el treballi i s'esborraran les seves categories/activitats o nota directa. Aquesta acció no es pot desfer.`)) return;
  mut(() => {
    const c = C();
    c.config.ras = c.config.ras.filter(r => r.id !== id);
    c.reptes.forEach(r => { r.ras = r.ras.filter(x => x !== id); r.instruments.forEach(i => delete i.pes[id]); });
    delete c.activitatsRA[id];
    delete c.notesDirectes[id];
    if (vista === "ra:" + id) { vista = "grup"; landingTab = "configuracio"; }
  });
}
function posaDirecta(raId, alId, val) {
  mut(() => {
    if (!C().notesDirectes[raId]) C().notesDirectes[raId] = {};
    if (val === "") delete C().notesDirectes[raId][alId];
    else C().notesDirectes[raId][alId] = clamp(Number(val), 0, 10);
  });
}
function exportaCSVModul() {
  const sep = ";", ras = C().config.ras;
  let out = ["Alumne", ...ras.map(r => r.id), "Mòdul", "Estat"].join(sep) + "\n";
  for (const al of C().alumnes) {
    const vals = ras.map(ra => { const x = notaRAModul(al.id, ra.id); return x.nota === null ? "" : x.nota.toFixed(2).replace(".", ","); });
    const m = notaModul(al.id);
    const pend = ras.some(ra => notaRAModul(al.id, ra.id).pendent);
    out += [al.nom, ...vals, m.nota === null ? "" : m.nota.toFixed(2).replace(".", ","), pend ? "PENDENT" : (m.completa ? "Completa" : "Provisional")].join(sep) + "\n";
  }
  baixa("notes_modul.csv", out, "text/csv");
}

async function esborraAlumne(id) {
  const al = alumne(id);
  if (!await confirmModal(`Segur que vols esborrar ${al.nom} i totes les seves notes de tots els reptes?`)) return;
  mut(() => {
    C().alumnes = C().alumnes.filter(a => a.id !== id);
    for (const rep of C().reptes) {
      rep.equips.forEach(e => e.membres = e.membres.filter(m => m !== id));
      for (const k of Object.keys(rep.avaluacions.individual)) delete rep.avaluacions.individual[k][id];
      for (const k of Object.keys(rep.avaluacions.factors)) delete rep.avaluacions.factors[k][id];
    }
    for (const k of Object.keys(C().notesDirectes)) delete C().notesDirectes[k][id];
  });
}

/* ---- Seguretat: bloqueig amb contrasenya (protecció bàsica, no xifratge) ---- */
async function hashText(text) {
  const s = "av2000::" + text;
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    // entorn sense crypto.subtle (context no segur, p. ex. file:// en alguns navegadors): hash de reserva
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return "f" + h.toString(16);
  }
}

        <button class="btn pri" onclick="desaContrasenya()">${s.hash ? "Canvia la contrasenya" : "Desa la contrasenya"}</button>
      </div>
      ${s.hash ? '<p class="tiny mut" style="margin-top:8px">✓ Ja hi ha una contrasenya activa.</p>'
        : '<div class="avis roig">Encara no has desat cap contrasenya: el bloqueig no s\'activarà fins que en desis una.</div>'}
      <div class="toolrow" style="margin-top:16px">
        <label class="tiny soft" for="mins-inactivitat">Bloqueig automàtic per inactivitat</label>
        <input id="mins-inactivitat" class="nota" type="number" min="0" step="1" style="max-width:70px" value="${s.minutsInactivitat ?? ""}" placeholder="—"
          onchange="canviaMinutsInactivitat(this.value)">
        <span class="tiny mut">minuts (buit = no bloquegis mai automàticament)</span>
      </div>
      <div class="toolrow" style="margin-top:16px">
        <button class="btn" ${s.hash ? "" : "disabled"} onclick="bloqueja()">Bloqueja ara</button>
      </div>
    </div>` : ""}
  </div>`;
}
function toggleProteccio(on) {
  mut(() => { state.seguretat.activat = on; if (!on) { state.seguretat.hash = null; clearTimeout(inactivityTimer); } });
}
async function desaContrasenya() {
  const pw = $("#pw-nova").value, pw2 = $("#pw-confirma").value;
  if (!pw || pw.length < 4) { await alertModal("La contrasenya ha de tenir com a mínim 4 caràcters."); return; }
  if (pw !== pw2) { await alertModal("Les dues contrasenyes no coincideixen."); return; }
  const hash = await hashText(pw);
  mut(() => { state.seguretat.hash = hash; });
  reiniciaTemporitzadorInactivitat();
  await alertModal("Contrasenya desada.");
}
function canviaMinutsInactivitat(v) {
  mut(() => { state.seguretat.minutsInactivitat = v === "" ? null : Math.max(0, Math.round(Number(v) || 0)); });
  reiniciaTemporitzadorInactivitat();
}
/* ---- pantalla de bloqueig ---- */
let inactivityTimer = null;
function mostraBloqueig() {
  clearTimeout(inactivityTimer);
  $("#app").style.visibility = "hidden";
  $("#lock-screen").style.display = "flex";
  setTimeout(() => { const el = $("#lock-pw"); if (el) el.focus(); }, 0);
}
function amagaBloqueig() {
  $("#lock-screen").style.display = "none";
  $("#app").style.visibility = "visible";
}
function bloqueja() {
  if (!state || !state.seguretat.activat || !state.seguretat.hash) return; // sense estat carregat o sense contrasenya desada no bloquegem: deixaria l'usuari fora
  mostraBloqueig();
}
async function intentaDesbloqueig() {
  const pw = $("#lock-pw").value;
  const hash = await hashText(pw);
  if (hash === state.seguretat.hash) {
    $("#lock-pw").value = "";
    $("#lock-error").style.display = "none";
    amagaBloqueig();
    render();
    reiniciaTemporitzadorInactivitat();
  } else {
    $("#lock-error").style.display = "block";
    $("#lock-pw").value = "";
    $("#lock-pw").focus();
  }
}
function reiniciaTemporitzadorInactivitat() {
  clearTimeout(inactivityTimer);
  if (!state || !state.seguretat.activat || !state.seguretat.hash || !state.seguretat.minutsInactivitat) return;
  inactivityTimer = setTimeout(bloqueja, state.seguretat.minutsInactivitat * 60000);
}
["mousemove", "keydown", "mousedown", "touchstart", "scroll"].forEach(ev =>
  document.addEventListener(ev, () => { if ($("#lock-screen").style.display !== "flex") reiniciaTemporitzadorInactivitat(); }, { passive: true }));

function vDades() {
  return `
  <div class="crumb">Persistència i còpies</div>
  <h1>Dades</h1>
  <p class="lead">Les dades es desen automàticament al magatzem persistent a cada canvi. A més, pots exportar-ho tot (tots els grups-aula) a un fitxer de text JSON i reimportar-lo quan calgui.</p>
  <div class="card" style="max-width:640px">
    <h2>On es desa ara mateix</h2>
    ${backend === "gas" ? `
      <p>Aplicació web de Google <span class="badge b-verd">activa</span>: cada canvi es desa automàticament al fitxer <b>avaluacio_mp8.json</b> del teu Google Drive. Hi pots accedir des de qualsevol dispositiu amb el teu compte.</p>`
    : backend === "claude" ? `
      <p>Magatzem persistent de Claude <span class="badge b-verd">actiu</span>: els canvis es conserven automàticament entre sessions en aquest compte.</p>`
    : backend === "local" ? `
      <p>Còpia automàtica al navegador <span class="badge b-verd">activa</span> (es conserva mentre no esborris les dades de navegació d'aquest lloc).</p>
      <p style="margin-top:8px">Fitxer local d'autoguardat:
        ${fitxerHandle && !calReconnectar ? `<span class="badge b-verd">connectat</span> «${esc(fitxerNom)}» — cada canvi s'hi escriu automàticament.`
        : fitxerHandle && calReconnectar ? `<span class="badge b-ambre">pendent de permís</span> «${esc(fitxerNom)}»`
        : `<span class="badge b-gris">no connectat</span>`}</p>
      <div class="toolrow" style="margin:10px 0 0">
        ${fitxerHandle && calReconnectar ? `<button class="btn pri" onclick="reconnectaFitxer()">Reconnecta el fitxer</button>` : ""}
        ${!fitxerHandle ? `<button class="btn pri" onclick="connectaFitxer()">Connecta un fitxer local…</button>` : `<button class="btn" onclick="connectaFitxer()">Canvia de fitxer…</button><button class="btn peril" onclick="desconnectaFitxer()">Desconnecta</button>`}
      </div>
      <p class="tiny mut" style="margin-top:10px">${suportaFSA
        ? "En connectar un fitxer (crea'n un o tria'n un d'existent), l'aplicació hi desarà cada canvi. Per seguretat, el navegador pot demanar-te de reconfirmar el permís amb un clic en tornar a obrir la pàgina."
        : "El teu navegador no suporta l'escriptura directa de fitxers (File System Access): usa Chrome o Edge per a l'autoguardat en fitxer. Amb aquest navegador, les dades es desen al navegador i pots exportar el JSON manualment."}</p>`
    : `
      <p>Magatzem <span class="badge b-roig">no disponible</span>: treballes en mode memòria. Exporta el fitxer JSON abans de tancar per no perdre res.</p>
      ${suportaFSA ? `<div class="toolrow" style="margin:10px 0 0"><button class="btn pri" onclick="connectaFitxer()">Connecta un fitxer local…</button></div>` : ""}`}
  </div>
  <div class="card" style="max-width:640px">
    <h2>Fitxer de text (JSON)</h2>
    <div class="toolrow" style="margin:10px 0 0">
      <button class="btn pri" onclick="exportaJSON()">Exporta còpia de seguretat</button>
      <label class="btn" style="display:inline-block">Importa fitxer…<input type="file" accept=".json,.txt,application/json" style="display:none" onchange="importaJSON(this)"></label>
    </div>
    <p class="tiny mut" style="margin-top:10px">S'exporten TOTS els grups-aula (cada mòdul + grup, amb alumnat, reptes, RA en mode Activitats i notes directes). La importació substitueix completament les dades actuals (tots els grups-aula) i accepta també fitxers de versions anteriors.</p>
  </div>
  <div class="card" style="max-width:640px">
    <h2>Restabliment</h2>
    <div class="toolrow" style="margin:10px 0 0">
      <button class="btn peril" onclick="restableix()">Restableix les dades d'exemple (3 reptes)</button>
    </div>
    <p class="tiny mut" style="margin-top:10px">Esborra tots els grups-aula actuals i en deixa un de sol, amb els 16 alumnes de mostra i els tres reptes de l'exemple (L'oficina digital amb notes d'exemple; La plataforma interna i Sortim al món amb l'estructura preparada).</p>
  </div>`;
}
function exportaJSON() {
  baixa("avaluacio_mp8_" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(state, null, 2), "application/json");
}
function importaJSON(inp) {
  const f = inp.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const brut = JSON.parse(r.result);
      const nou = normalitza(brut);
      if (!nou || !nou.cursos || !nou.cursos.length) throw new Error("estructura");
      if (!await confirmModal("Substituir totes les dades actuals (tots els grups-aula) per les del fitxer?")) { inp.value = ""; return; }
      state = nou; anarPrimeraVistaDelCurs(); save(); render();
    } catch (e) {
      await alertModal("El fitxer no té el format esperat. Comprova que sigui una exportació d'aquesta aplicació.");
    }
    inp.value = "";
  };
  r.readAsText(f);
}
async function restableix() {
  if (!await confirmModal("Segur? S'esborraran totes les dades actuals (tots els grups-aula) i es carregarà l'exemple complet d'un grup-aula.")) return;
  state = seed(); anarPrimeraVistaDelCurs(); save(); render();
}

/* ================= arrencada ================= */
(async function () {
  const desat = await initStorage();
  state = desat || seed();
  anarPrimeraVistaDelCurs();
  if (location.hash) aplicaHash(); // restaura l'estat si s'obre des d'un marcador
  save(); // consolida (i escriu una eventual migració)
  if (state.seguretat.activat && state.seguretat.hash) {
    mostraBloqueig();
  } else {
    render();
    reiniciaTemporitzadorInactivitat();
  }
})();
</script>
</body>
</html>
